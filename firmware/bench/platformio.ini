; MRider bench bring-up sketches
;
; One PlatformIO project, one environment per step of the five-step bench
; order in docs/build/03-electrical.md 3.5.3. Each environment builds exactly
; one source file, so there is no shared state between them and no sketch can
; mask another's fault.
;
;   pio run -e i2c_scan     -t upload -t monitor
;   pio run -e as5600_check -t upload -t monitor
;   pio run -e quad_count   -t upload -t monitor
;
; Steps 1 and 2 of that order need NO firmware. They are a meter on a rail and
; a meter on a latch output, and they come first precisely so that a fault
; found there can never be blamed on code.

[env]
; PINNED. An unpinned platform means the same project commit builds differently
; next semester, and "it worked in October" stops being a statement anybody can
; act on. 6.0.0 is the registry's current release at the time of pinning, not a
; version these sketches have been proven on - nothing here had ever been
; compiled. The first green CI run is the proof, and it is reproducible from
; then on. Raising this is a deliberate, reviewable commit.
platform      = teensy@6.0.0
board         = teensy41
framework     = arduino
monitor_speed = 115200
build_flags   = -Wall -Wextra

[env:i2c_scan]
build_src_filter = +<i2c_scan.cpp>

[env:as5600_check]
build_src_filter = +<as5600_check.cpp>

[env:quad_count]
build_src_filter = +<quad_count.cpp>
