name: workspace

# The ROS 2 workspace had no CI at all until 2026-09-14, when a fresh clone
# turned out not to build: three packages installed a `launch` directory that
# had never held a file, and git does not track empty directories. Every machine
# that already had a working build was blind to it, which was every machine that
# could have caught it.
#
# This job is the thing that was missing - something that only ever sees a clean
# checkout.

on:
  push:
    branches: [main]
    paths:
      - 'ros2_ws/**'
      - 'scripts/check_packages.py'
      - '.github/workflows/workspace.yml'
  pull_request:
    paths:
      - 'ros2_ws/**'
      - 'scripts/check_packages.py'
      - '.github/workflows/workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-layout:
    # Deliberately not a ROS container: this check needs git and Python and
    # nothing else, so it runs in seconds and cannot rot against a distro image.
    # It is a structural check, not a build - see check_packages.py on what that
    # does and does not cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every installed directory exists in a clean checkout
        run: python3 scripts/check_packages.py
