      - DBW Architecture Review (2026-08): design/adr-dbw-architecture-review.md
      - Architecture: design/architecture.md
      - Vehicle: design/vehicle.md
      - Drive-by-Wire: design/dbw.md
      - Safety: design/safety.md
      - Sensors: design/sensors.md
      - Calibration: design/calibration.md
