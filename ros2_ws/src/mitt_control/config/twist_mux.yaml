# Command arbitration for the twin.
#
# On the REAL vehicle this is NOT the safety authority. Authority there is
# electrical and layered (docs/design/safety.md 1.3): hardware E-stop, relay
# MUX to STOCK, hardware RC signal MUX, then SBUS override - three of which
# work with the controller firmware dead. A software mux cannot do that job
# and must never be presented as if it could.
#
# What this file does is more modest and still worth having: it decides which
# software source reaches the controller, and gives joystick input priority
# over autonomy so an operator can take over in simulation.

twist_mux:
  ros__parameters:
    use_sim_time: true

    topics:
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 100      # highest: a human at the sticks wins
      # Nav2's FINAL output, which on Humble is plain /cmd_vel.
      #
      # Not cmd_vel_nav. That name is misleading: in nav2_bringup's
      # navigation_launch.py, controller_server's output is remapped TO
      # cmd_vel_nav, which is then the INPUT to velocity_smoother, whose
      # output is /cmd_vel. Subscribing to cmd_vel_nav here would work, but
      # would silently bypass velocity_smoother - taking raw controller
      # output and discarding the acceleration limiting that matters more on
      # a steered vehicle than a differential one.
      navigation:
        topic: cmd_vel
        timeout: 0.5
        priority: 10
