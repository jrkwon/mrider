# Vehicle 1 - MEASURED values only.
#
# This file is an OVERLAY on ../mitt_dimensions.yaml, which holds the estimates
# every vehicle starts from. A key written here replaces the estimate for
# vehicle 1 and for nothing else; a key not written here is still an estimate.
# So this file answers one question at a glance: what has team 1 measured?
#
#   - Use the key names of ../mitt_dimensions.yaml exactly. A name that file
#     does not have is refused by scripts/check_vehicle_dims.py and by both
#     launch files. A bare `xacro ... vehicle:=N` does not check it.
#   - Write a value only after measuring it, with how in a comment. No TODO
#     lives here: an unmeasured value simply is not in this file.
#   - This is the ONE file of your team's that lands on main during the
#     semester. Open a pull request from your fork that touches this file
#     and nothing else (docs/course/teams.md, "Where your work lives").
#
# Used by:   ros2 launch mitt_bringup real.launch.py vehicle:=1
#            ros2 launch mitt_bringup sim.launch.py  vehicle:=1   (the twin of vehicle 1)
#            ros2 launch mitt_navigation nav2.launch.py vehicle:=1   (footprint, turning radius)
#
# Example, once measured (calibration.md 1):
#
#   wheelbase: 0.641          # m  axle centre to axle centre, tape, 2026-11-20
#   min_turning_radius: 1.58  # m  calibration.md 1.5, the LARGER of both locks

# Measured on team 1's vehicle.
wheelbase: 0.533          # m  front axle centre to rear axle centre, tape, 2026-10-28
track_width: 0.435        # m  front wheel centre to centre, tape, 2026-10-28

# Rear axle centre to floor, tape, vehicle on the floor, 2026-11-23. Same value
# with and without the equipment load.
# Hard plastic wheel. A tape round the tyre gives 645 mm (r 0.1027).
wheel_radius: 0.101       # m

# Full circle at each full lock, steering turned by hand, 2026-10-28.
# Diameter: tape from one rear tyre's outer edge at the start to the other rear
# tyre's same-side edge half a turn later. The tyre offsets cancel, so this is
# the path of the rear axle centre. Left 4.09 and 4.30 m (mean 4.195), right
# 3.91 m. The larger lock is left: 4.195 / 2.
min_turning_radius: 2.10  # m
