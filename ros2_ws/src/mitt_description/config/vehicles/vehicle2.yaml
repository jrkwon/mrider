# Vehicle 2 - MEASURED values only.
#
# This file is an OVERLAY on ../mitt_dimensions.yaml, which holds the estimates
# every vehicle starts from. A key written here replaces the estimate for
# vehicle 2 and for nothing else; a key not written here is still an estimate.
# So this file answers one question at a glance: what has team 2 measured?
#
#   - Use the key names of ../mitt_dimensions.yaml exactly. A name that file
#     does not have is refused by scripts/check_vehicle_dims.py and by both
#     launch files. A bare `xacro ... vehicle:=N` does not check it.
#   - Write a value only after measuring it, with how in a comment. No TODO
#     lives here: an unmeasured value simply is not in this file.
#   - This is the ONE file of your team's that lands on main during the
#     semester. Open a pull request from your fork that touches this file
#     and nothing else (docs/course/teams.md, "Where your work lives").
#
# Used by:   ros2 launch mitt_bringup real.launch.py vehicle:=2
#            ros2 launch mitt_bringup sim.launch.py  vehicle:=2   (the twin of vehicle 2)
#            ros2 launch mitt_navigation nav2.launch.py vehicle:=2   (footprint, turning radius)
#
# Example, once measured (calibration.md 1):
#
#   wheelbase: 0.641          # m  axle centre to axle centre, tape, 2026-11-20
#   min_turning_radius: 1.58  # m  calibration.md 1.5, the LARGER of both locks

wheelbase: 0.535           # m  rear axle centre -> front axle centre, tape, 2026-10-30
track_width: 0.37          # m  wheel separation, tape, 2026-10-30
wheel_radius: 0.102        # m  loaded rolling circumference 0.643 m / 2pi, mark tyre and roll one revolution, 2026-10-30
min_turning_radius: 2.15   # m  rear axle centre at full lock, left 2.150 / right 2.085, the LARGER (calibration.md 1.5), 2026-10-30

# Road-wheel lock from the two measured values above, not yet from an angle gauge:
# atan(0.535 / 2.150) = 13.97 deg left, atan(0.535 / 2.085) = 14.39 deg right; the smaller.
steer_limit_deg: 14.0      # deg  derived from wheelbase and min_turning_radius (2026-10-30)
