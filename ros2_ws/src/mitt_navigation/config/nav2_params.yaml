# MITT Nav2 configuration.
#
# ============================================================================
#  ADR-SW2 RESOLVED: Regulated Pure Pursuit, not DWB.
#
#  docs/design/software.md ADR-SW2 pre-registered RPP as the Ackermann swap
#  for DWB, with the trigger "path-tracking error or infeasible commands
#  during turning tests". That trigger is met ANALYTICALLY, before any test:
#
#      R_min = wheelbase / tan(steer_limit)
#            = 0.63 m / tan(22.5 deg)
#            = 1.52 m
#
#  DWB samples angular velocities assuming the base can rotate about its own
#  centre. This vehicle cannot: with a 1.52 m minimum turning radius, most of
#  DWB's velocity space is physically unreachable, so it would spend the run
#  emitting commands the steering cannot execute. Running it first to "see it
#  fail" would burn a week confirming trigonometry.
#
#  The reuse-first instinct in ADR-SW2 was right in general; it just loses to
#  a number here. Recorded rather than silently swapped.
#
#  PLANNER, UPDATED 2026-08-09: NavFn -> SmacPlannerHybrid.
#
#  The line that used to sit here said NavFn paths might prove unfollowable in
#  the depot's tight aisles, and that SmacPlannerHybrid was the next step. That
#  is exactly what happened on the first real Nav2 runs: repeated aborts with
#  "detected collision ahead!" on paths RPP could not drive, and a trapped
#  vehicle with no software recovery. The swap is done - see planner_server.
# ============================================================================
#
# Geometry MUST stay in sync with mitt_description/config/mitt_dimensions.yaml.
# NOTHING there is measured yet.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    set_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /ackermann_steering_controller/odometry
    bt_loop_duration: 10
    default_server_timeout: 20

    # MITT-specific behavior trees. These are NOT optional.
    #
    # The stock Nav2 trees call Spin and BackUp in their recovery RoundRobin.
    # behavior_server below loads only the "wait" plugin, because a +/- 22.5 deg
    # Ackermann car cannot spin in place and does not reverse. Loading the stock
    # trees against that plugin list fails at BT parse time -
    #
    #     Exception when loading BT: Action server spin not available
    #
    # - which leaves bt_navigator unconfigured and makes lifecycle_manager abort
    # bringup of the ENTIRE navigation stack. The symptom is misleading: planner,
    # controller and both costmaps report active while navigation is simply
    # absent, with no goal ever accepted.
    #
    # Both paths must be overridden. bt_navigator loads both at configure time,
    # so overriding only navigate_to_pose still fails on the through-poses tree.
    default_nav_to_pose_bt_xml: $(find-pkg-share mitt_navigation)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share mitt_navigation)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /ackermann_steering_controller/odometry
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    # Tolerances widened from 0.25 m / 0.35 rad after the first Nav2 goal test
    # in the depot world (2026-08-08). MEASURED, not guessed:
    #
    # The vehicle drove ~10 m to a goal and arrived 0.75 m away, then began
    # ORBITING it - (-4.19,-1.46), (-5.41,0.43), (-2.28,0.81), (-4.51,-1.35),
    # repeating indefinitely. It never converged and never failed; it simply
    # circled.
    #
    # The cause is geometric, not a tuning accident. Minimum turning radius is
    # 1.52 m, in-place rotation is impossible, and allow_reversing is false. A
    # vehicle with those three properties cannot reduce a 0.75 m pose error: it
    # can only loop past the goal at >= 1.52 m radius and try again. Asking for
    # 0.25 m is asking it to parallel-park without reverse.
    #
    # 0.6 m is roughly 40% of the turning radius and is achievable in one pass.
    # yaw 0.6 rad (~34 deg) likewise: heading at arrival is whatever the final
    # arc produced, and the car cannot trim it in place.
    #
    # This is a workaround, not the fix. Precise pose arrival needs a
    # kinematically-aware planner - SmacPlannerHybrid, already pre-registered
    # as the next step in the ADR-SW2 note at the top of this file - and
    # probably reverse, which is a hardware safety question (no rear sensing).
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 0.6
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6       # well under the 1.4 m/s cap; <= walking speed
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5

      # THE constraint that decides this controller. 1.52 m computed above,
      # with margin. Update whenever wheelbase or steer limit is measured.
      min_turning_radius: 1.6

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.0
      regulated_linear_scaling_min_speed: 0.25

      # Rotating to heading is physically impossible on this vehicle, so it
      # must stay off - leaving it on makes the controller stall at every goal.
      #
      # These two are MUTUALLY EXCLUSIVE in Nav2: setting both true is rejected
      # at runtime with "Both use_rotate_to_heading and allow_reversing
      # parameter cannot be set to true", and the controller silently re-enables
      # rotate-to-heading instead. use_rotate_to_heading must therefore stay
      # false for reversing to work at all.
      use_rotate_to_heading: false

      # Reversing enabled 2026-08-09, with SmacPlannerHybrid (see planner_server).
      # RPP only reverses where the PATH reverses, and NavFn never produced such
      # a path - so this was inert until the planner changed. Together they are
      # what lets the vehicle back out of a dead end instead of waiting for a
      # human. See the note on blind reverse under planner_server.
      allow_reversing: true

      use_cost_regulated_linear_velocity_scaling: false
      transform_tolerance: 0.2
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_collision_detection: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Rectangular footprint, not a radius. base_link is at the REAR AXLE, so
      # the body extends much further forward (+0.81 m) than back (-0.18 m).
      # A circular approximation would either clip the nose or refuse to fit
      # down the depot aisles.
      footprint: "[[0.81, 0.28], [0.81, -0.28], [-0.18, -0.28], [-0.18, 0.28]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.81, 0.28], [0.81, -0.28], [-0.18, -0.28], [-0.18, 0.28]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    # SmacPlannerHybrid, replacing NavFn 2026-08-09. This closes the second
    # half of ADR-SW2, which pre-registered a kinematically-aware planner.
    #
    # WHY. NavFn is a 2D grid search: it plans as though the robot were a point
    # that can change direction freely, so it happily returns paths this car
    # cannot drive. RPP then refuses them mid-follow - the depot runs aborted
    # repeatedly with "detected collision ahead!" on paths that were never
    # feasible in the first place (see software.md 4.4). Worse, a path that
    # ends with the nose against an obstacle leaves the vehicle where EVERY
    # subsequent plan starts in collision, and with no reverse there was no
    # software recovery at all: it sat there until a human took the sticks.
    #
    # SmacPlannerHybrid searches in (x, y, heading) using Reeds-Shepp curves
    # bounded by minimum_turning_radius, so a returned path is drivable by
    # construction rather than by luck.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0

      # REEDS_SHEPP permits reverse segments; DUBIN is forward-only. This is
      # the switch that actually grants the vehicle a reverse manoeuvre.
      motion_model_for_search: "REEDS_SHEPP"

      # Must stay >= the physical 1.52 m (0.63 / tan(22.5 deg)), with margin,
      # and in sync with FollowPath's min_turning_radius above. Re-derive both
      # when wheelbase or steer limit is finally MEASURED.
      minimum_turning_radius: 1.6

      angle_quantization_bins: 72     # 5 deg
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0

      # REVERSE IS DELIBERATELY EXPENSIVE, not merely allowed.
      #
      # The vehicle has NO REAR SENSING - the LiDAR faces forward and there is
      # no rear camera or bumper (sensors.md). Reversing is therefore BLIND,
      # and the costmap behind the vehicle is only as good as what was seen on
      # the way in. A high reverse_penalty keeps backing up as a manoeuvre of
      # last resort - used to escape a dead end, not to shortcut a turn.
      #
      # This is a twin doing its job: it has surfaced a hardware requirement
      # (rear sensing, or a hard cap on reverse distance and speed) before the
      # vehicle exists. Revisit when Track B decides. Until then, treat
      # autonomous reverse on the REAL car as unproven.
      reverse_penalty: 2.5
      change_penalty: 0.2            # discourage direction flapping
      non_straight_penalty: 1.2
      cost_penalty: 3.5
      retrospective_penalty: 0.025

      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # "wait" is the ONLY recovery behavior. Spin and BackUp are deliberately
    # absent: a non-holonomic car with a 1.52 m turning radius cannot spin in
    # place, and it does not reverse (allow_reversing: false, plus there is no
    # rear sensing). Recovery beyond clear-costmaps-and-wait is an operator
    # taking the RC sticks (docs/design/safety.md 1.2), not an autonomous
    # manoeuvre.
    #
    # This list is what forces the custom behavior trees configured under
    # bt_navigator above - the stock trees call Spin and BackUp and will not
    # load against it.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.0]
    min_velocity: [-0.6, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: /ackermann_steering_controller/odometry
    odom_duration: 0.1
