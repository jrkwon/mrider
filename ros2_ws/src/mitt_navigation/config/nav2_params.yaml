# MITT Nav2 configuration.
#
# ============================================================================
#  ADR-SW2 RESOLVED: Regulated Pure Pursuit, not DWB.
#
#  docs/design/software.md ADR-SW2 pre-registered RPP as the Ackermann swap
#  for DWB, with the trigger "path-tracking error or infeasible commands
#  during turning tests". That trigger is met ANALYTICALLY, before any test:
#
#      R_min = wheelbase / tan(steer_limit)
#            = 0.63 m / tan(22.5 deg)
#            = 1.52 m
#
#  DWB samples angular velocities assuming the base can rotate about its own
#  centre. This vehicle cannot: with a 1.52 m minimum turning radius, most of
#  DWB's velocity space is physically unreachable, so it would spend the run
#  emitting commands the steering cannot execute. Running it first to "see it
#  fail" would burn a week confirming trigonometry.
#
#  The reuse-first instinct in ADR-SW2 was right in general; it just loses to
#  a number here. Recorded rather than silently swapped.
#
#  Planner is still NavFn per ADR-SW2. NavFn ignores kinematics, but RPP
#  enforces its own curvature limits when following. If NavFn paths prove
#  unfollowable in the depot's tight aisles, SmacPlannerHybrid (which takes a
#  minimum_turning_radius directly) is the next step - not a fourth option.
# ============================================================================
#
# Geometry MUST stay in sync with mitt_description/config/mitt_dimensions.yaml.
# NOTHING there is measured yet.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    set_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /ackermann_steering_controller/odometry
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /ackermann_steering_controller/odometry
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35      # loose: a car cannot spin to fix heading
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6       # well under the 1.4 m/s cap; <= walking speed
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5

      # THE constraint that decides this controller. 1.52 m computed above,
      # with margin. Update whenever wheelbase or steer limit is measured.
      min_turning_radius: 1.6

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.0
      regulated_linear_scaling_min_speed: 0.25

      # A car has no reverse-and-rotate recovery. Rotating to heading is
      # physically impossible here, so it must stay off - leaving it on makes
      # the controller stall at every goal.
      use_rotate_to_heading: false
      allow_reversing: false

      use_cost_regulated_linear_velocity_scaling: false
      transform_tolerance: 0.2
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_collision_detection: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Rectangular footprint, not a radius. base_link is at the REAR AXLE, so
      # the body extends much further forward (+0.81 m) than back (-0.18 m).
      # A circular approximation would either clip the nose or refuse to fit
      # down the depot aisles.
      footprint: "[[0.81, 0.28], [0.81, -0.28], [-0.18, -0.28], [-0.18, 0.28]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.81, 0.28], [0.81, -0.28], [-0.18, -0.28], [-0.18, 0.28]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # Spin and BackUp are retained ONLY because the BT references them.
    # A non-holonomic car with no reverse gear cannot meaningfully execute
    # either; recovery on this platform is an operator taking the RC sticks
    # (docs/design/safety.md 1.2), not an autonomous manoeuvre.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.0]
    min_velocity: [-0.6, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: /ackermann_steering_controller/odometry
    odom_duration: 0.1
