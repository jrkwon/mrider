<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" width="980" height="820"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Hub and bore — which diameter is which</title>
  <desc>Three panels defining the two diameters this build keeps confusing. Left: the hub, the
  six-lobe rotating boss on the vehicle, whose diameter is measured across two opposite lobe
  crests. Middle: the bore, the hole through the printed carrier, which is not to be confused
  with the carrier’s own outside diameter. Bottom: the two assembled, with the deliberate
  clearance between them shown magnified, and the three mistakes that have already been made.</desc>
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/></marker>
    <marker id="ds" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#b91c1c"/></marker>
    <marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#334155"/></marker>
    <marker id="ks" markerWidth="8" markerHeight="8" refX="1" refY="2.5" orient="auto">
      <path d="M7,0 L7,5 L0,2.5 z" fill="#334155"/></marker>
  </defs>
  <rect width="980" height="820" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">Hub and bore — one is on the vehicle, the other is a hole in the print</text>
  <text x="24" y="56" font-size="13" fill="#475569">Both are diameters near 63 mm, which is why they keep getting swapped. They are not the same thing and neither is a fit.</text>
  <rect x="24" y="76" width="462" height="344" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="44" y="102" font-size="15" font-weight="bold" fill="#1e3a8a">HUB — on the vehicle. It ROTATES.</text>
  <text x="44" y="121" font-size="11.5" fill="#2563eb">An OUTSIDE diameter. Nothing is printed here; you measure it.</text>
  <circle cx="258" cy="268" r="80.3" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 4"/>
