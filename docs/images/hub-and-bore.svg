  <text x="258" y="272" font-size="10" fill="#475569" text-anchor="middle">axle</text>
  <line x1="192.2" y1="314.1" x2="323.8" y2="221.9" stroke="#b91c1c" stroke-width="2" marker-start="url(#ds)" marker-end="url(#d)"/>
  <text x="186" y="212" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">Ø62.7</text>
  <text x="186" y="226" font-size="11" fill="#b91c1c" text-anchor="middle">crest to crest</text>
  <line x1="303.5" y1="222.5" x2="366" y2="164" stroke="#64748b" stroke-width="1.2"/>
  <text x="370" y="162" font-size="10.5" fill="#64748b">root Ø —</text>
  <text x="370" y="175" font-size="10.5" fill="#64748b">NOT this one</text>
  <text x="44" y="388" font-size="12" fill="#1e3a8a">Six lobes is an <tspan font-weight="bold">even</tspan> count, so opposite crests face each other and a</text>
  <text x="44" y="405" font-size="12" fill="#1e3a8a">caliper — or a tape — reads the crest circle straight off. Three positions.</text>
  <rect x="498" y="76" width="458" height="344" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="518" y="102" font-size="15" font-weight="bold" fill="#92400e">BORE — in the printed carrier. It is a HOLE.</text>
  <text x="518" y="121" font-size="11.5" fill="#b45309">An INSIDE diameter. Nothing is measured here; you print it.</text>
