.2,191.2 258.3,190.6 260.6,189.9 262.8,189.1 265.2,188.3 267.7,187.5 270.2,186.7 272.8,185.9 275.4,185.4 278.0,184.9 280.7,184.7 283.3,184.8 285.9,185.0 288.4,185.6 290.8,186.4 293.0,187.5 295.1,188.9 297.0,190.6 298.7,192.4 300.2,194.5 301.6,196.8 302.7,199.2 303.7,201.7 304.5,204.3 305.2,206.8 305.7,209.4 306.2,212.0 306.7,214.4 307.2,216.8 307.6,219.1 308.2,221.2 308.9,223.3 309.7,225.2 310.6,227.0 311.7,228.7 313.0,230.4 314.4,232.0 316.0,233.5 317.7,235.1 319.5,236.7 321.4,238.3 323.4,240.0 325.3,241.8 327.2,243.7 329.1,245.7 330.8,247.8 332.3,250.0 333.6,252.2 334.6,254.6 335.4,257.0 335.8,259.5 336.0,262.0" fill="#dbe3ec" stroke="#64748b" stroke-width="2.0"/>
<circle cx="250" cy="262" r="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="250" y="266" font-size="10" fill="#64748b" text-anchor="middle">axle</text>
<line x1="164.0" y1="380.0" x2="336.0" y2="380.0" stroke="#1e3a8a" stroke-width="1.6"/><text x="250.0" y="374.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Ø62.82  crest to crest</text>
<text x="250" y="396" font-size="10.5" fill="#b91c1c" text-anchor="middle">root Ø is NOT this one</text>
<text x="44" y="426" font-size="10.5" fill="#64748b">6 lobes is an EVEN count, so opposite crests face each other</text>
<text x="44" y="442" font-size="10.5" fill="#64748b">and a caliper reads the crest circle straight off. Three positions.</text>
<rect x="504" y="100" width="452" height="364" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="524.0" y="128.0" font-size="13.5" font-weight="bold" fill="#0f172a">BORE — in the printed carrier. It is a HOLE.</text>
<text x="524.0" y="146.0" font-size="11" font-weight="normal" fill="#64748b">An INSIDE diameter. Nothing is measured here; you print it.</text>
<circle cx="730" cy="262" r="100" fill="#fde68a" stroke="#b45309" stroke-width="2.4"/>
<circle cx="730" cy="262" r="82" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="648.0" y1="390.0" x2="812.0" y2="390.0" stroke="#1e3a8a" stroke-width="1.6"/><text x="730.0" y="384.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Ø64.02  the bore</text>
<text x="730" y="410" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="middle">Ø78.02 — the carrier’s OUTSIDE Ø, the magnet track</text>
<text x="524" y="426" font-size="10.5" fill="#64748b">Two diameters on one part. The bore faces the HUB,</text>
<text x="524" y="442" font-size="10.5" fill="#64748b">the OD faces the SENSOR.</text>
<text x="44.0" y="514.0" font-size="13.5" font-weight="bold" fill="#b45309">TOGETHER — the bore is bigger than the hub, ON PURPOSE</text>
<text x="44.0" y="538.0" font-size="12" font-weight="normal" fill="#78350f">Ø64.02 bore − Ø62.82 hub = 1.20 mm on diameter, 0.60 mm per side. It is SUPPOSED to rattle.</text>
<text x="44.0" y="556.0" font-size="12" font-weight="normal" fill="#78350f">The three grub screws remove the rattle. The bore never does.</text>
<rect x="36.0" y="566.0" width="908.0" height="118.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="60.0" y="590.0" font-size="12.5" font-weight="bold" fill="#7f1d1d">And they do it with 0.05 mm to spare, not with room to burn.</text>
<text x="60" y="610.0" font-size="11" fill="#7f1d1d">a screw reaches past the bore</text>
<text x="430" y="610.0" font-size="10.5" fill="#b45309">SET_SCREW_L 8.0 − WALL 7.0</text>
<text x="912" y="610.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="end">1.00 mm</text>
<text x="60" y="630.0" font-size="11" fill="#7f1d1d">worst case it must close, per side</text>
<text x="430" y="630.0" font-size="10.5" fill="#b45309">(BORE_CLEAR 1.2 + HUB_TOL 0.7) / 2</text>
<text x="912" y="630.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="end">0.95 mm</text>
<text x="60" y="650.0" font-size="11" fill="#7f1d1d">so the margin is</text>
<text x="430" y="650.0" font-size="10.5" fill="#b45309">SET_SCREW_L − SPAN_MAX 7.95</text>
<text x="912" y="650.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="end">0.05 mm  (1.05×)</text>
<text x="44.0" y="714.0" font-size="12.5" font-weight="bold" fill="#0f172a">Three ways this has already gone wrong</text>
<text x="44.0" y="734.0" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">• The fixed grey collar around the hub is not the hub.</tspan> It does not rotate — that one takes the sensor bracket.</text>
<text x="44.0" y="754.0" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">• Root Ø is not crest Ø.</tspan> The bore has to clear the CRESTS, which is the larger of the two.</text>
<text x="44.0" y="774.0" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">• A wrap measures π(D + its own thickness).</tspan> A 2 mm wire read 205 mm, put the hub 2.3 mm high, and a ring was printed 4 mm oversize.</text>
</svg>