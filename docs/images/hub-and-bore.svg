  <text x="729" y="243" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">Ø63.9</text>
  <text x="729" y="288" font-size="11" fill="#b91c1c" text-anchor="middle">the bore</text>
  <line x1="629.3" y1="365.7" x2="828.7" y2="365.7" stroke="#334155" stroke-width="1.6" marker-start="url(#ks)" marker-end="url(#k)"/>
  <text x="729" y="381.7" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Ø77.9 — the carrier’s OUTSIDE Ø, the magnet track</text>
  <text x="518" y="396" font-size="12" fill="#92400e">Two diameters on one part.</text>
  <text x="518" y="412" font-size="12" font-weight="bold" fill="#92400e">The bore faces the hub. The OD faces the sensor.</text>
  <rect x="24" y="432" width="932" height="262" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="44" y="458" font-size="15" font-weight="bold" fill="#0f172a">TOGETHER — the bore is bigger than the hub, on purpose</text>
  <circle cx="150" cy="580" r="58.7" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <circle cx="150" cy="580" r="48.2" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
