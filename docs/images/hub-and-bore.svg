<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 812" width="980" height="812" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title>Hub and bore - which diameter is which</title>
<desc>Three panels. Left: the hub, the lobed rotating boss on the vehicle, an outside diameter measured across two opposite crests. Right: the bore, the hole through the printed carrier, and the carrier’s own larger outside diameter which carries the magnets. Bottom: the two together, the deliberate clearance between them, and the arithmetic showing a grub screw clears the worst-case gap by five hundredths of a millimetre - not by the wide margin an earlier version of this figure claimed.</desc>
<rect width="980" height="812" fill="#ffffff"/>
<text x="24" y="36" font-size="19" font-weight="bold" fill="#0f172a">Hub and bore — one is on the vehicle, the other is a hole in the print</text>
<text x="24" y="58" font-size="12" fill="#64748b">Both are diameters near 63 mm, which is why they keep getting swapped. Neither is a fit.</text>
<text x="24" y="76" font-size="11" fill="#64748b">Every figure here is read from cad/drive_encoder_carrier.scad.</text>
<rect x="24" y="484" width="932" height="312" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect x="24" y="100" width="452" height="364" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="44.0" y="128.0" font-size="13.5" font-weight="bold" fill="#0f172a">HUB — on the vehicle. It ROTATES.</text>
<text x="44.0" y="146.0" font-size="11" font-weight="normal" fill="#64748b">An OUTSIDE diameter. Nothing is printed here; you measure it.</text>
