  <text x="526" y="618" font-size="10.5" fill="#92400e" text-anchor="middle">carrier wall, 7 mm</text>
  <text x="645" y="618" font-size="10.5" fill="#1e3a8a" text-anchor="middle">magnet</text>
  <line x1="431.2" y1="498" x2="431.2" y2="520" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="431" y="492" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">0.60 mm per side</text>
  <text x="530" y="492" font-size="11" fill="#b91c1c">— drawn 34× the scale of the ring at left</text>
  <text x="370" y="646" font-size="13" font-weight="bold" fill="#0f172a">bore 63.9 − hub 62.7 = 1.2 mm on diameter, 0.60 mm per side.</text>
  <text x="370" y="666" font-size="12.5" fill="#334155">It is <tspan font-weight="bold">supposed</tspan> to rattle. The screws remove the rattle, not the bore — they</text>
  <text x="370" y="684" font-size="12.5" fill="#334155">reach 3 mm past it, five times what they must close.</text>
  <rect x="24" y="706" width="932" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="44" y="730" font-size="13" font-weight="bold" fill="#7f1d1d">Three ways this has already gone wrong</text>
  <text x="44" y="752" font-size="12" fill="#7f1d1d">• <tspan font-weight="bold">The fixed grey collar around the hub is not the hub.</tspan> It does not rotate — that one takes the sensor bracket, not the carrier.</text>
  <text x="44" y="771" font-size="12" fill="#7f1d1d">• <tspan font-weight="bold">Root Ø is not crest Ø.</tspan> The bore has to clear the crests, which is the larger of the two.</text>
  <text x="44" y="790" font-size="12" fill="#7f1d1d">• <tspan font-weight="bold">A wrap measures π(D + its own thickness).</tspan> A 2 mm wire read 205 mm and put the hub 2.3 mm high, and a ring was printed 4 mm oversize.</text>
</svg>
