<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>The equipment plate is the battery bay's lid — bearing on the rim, vented over the controller</title>
  <desc>Left: a plan view of the cockpit with the seat removed, showing the battery and stock
  controller in an open bay whose walls finish in a continuous flat rim, the external charge port on
  the wall between the bay and the footwell, and the footwell ahead. Right top: a side section
  through the bay showing the lid bearing on the rim, a vent opening placed directly over the
  controller whose top is flush with that rim, spare depth above the battery, and the lid stopping
  at the rim so the charge port stays reachable. Right bottom: the answers to D8, D9 and D10 and
  the three design rules that follow from them.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#15803d"/>
    </marker>
    <pattern id="mat" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eaf0f7"/>
      <path d="M0,10 L5,5 L10,10" fill="none" stroke="#b8c6d6" stroke-width="1.1"/>
    </pattern>
    <pattern id="ply" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#fde8c8"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#d9a259" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="790" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">
    The equipment plate is the battery bay's lid
  </text>
  <text x="24" y="56" font-size="13" fill="#475569">
    D8, D9 and D10 answered 2026-10-19. All three make the lid simpler, and together they confirm the mast may live on it.
  </text>

  <!-- ================= PANEL A : plan ================= -->
  <rect x="24" y="76" width="446" height="686" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="102" font-size="14.5" font-weight="bold" fill="#0f172a">A · Seat removed — plan view</text>

  <rect x="70" y="124" width="356" height="596" rx="18" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <text x="222" y="116" font-size="11.5" font-weight="bold" fill="#475569">FRONT</text>
  <path d="M250,120 L250,100" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- footwell -->
  <rect x="88" y="142" width="320" height="168" rx="6" fill="url(#mat)" stroke="#2563eb" stroke-width="2.2"/>
  <text x="104" y="166" font-size="12.5" font-weight="bold" fill="#1e3a8a">footwell</text>
  <text x="104" y="184" font-size="10.5" fill="#1d4ed8">the MDDS30 lives here — open air</text>
  <circle cx="306" cy="224" r="14" fill="none" stroke="#64748b" stroke-width="2.4"/>
  <circle cx="306" cy="224" r="4" fill="#64748b"/>
  <text x="326" y="220" font-size="10.5" fill="#64748b">column</text>

  <!-- charge port keep-out -->
  <rect x="150" y="262" width="96" height="48" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="156" y="282" font-size="10.5" font-weight="bold" fill="#b91c1c">charger</text>
  <text x="156" y="296" font-size="10.5" font-weight="bold" fill="#b91c1c">keep-out</text>

  <!-- the bay -->
  <rect x="88" y="326" width="320" height="372" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <rect x="106" y="344" width="284" height="336" rx="5" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="112" y="320" font-size="12.5" font-weight="bold" fill="#92400e">the bay — continuous RIM in yellow</text>

  <!-- charge port on the dividing wall -->
  <rect x="184" y="326" width="34" height="16" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="226" y="339" font-size="10.5" font-weight="bold" fill="#b91c1c">charge port — D8</text>

  <!-- battery + controller inside -->
  <rect x="126" y="384" width="142" height="124" rx="4" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <text x="140" y="450" font-size="11" font-weight="bold" fill="#e5e7eb">battery</text>
  <text x="134" y="468" font-size="9.5" fill="#9ca3af">spare depth above</text>
  <rect x="126" y="528" width="142" height="86" rx="4" fill="#4b5563" stroke="#d1d5db" stroke-width="2"/>
  <text x="138" y="564" font-size="11" font-weight="bold" fill="#f3f4f6">controller</text>
  <text x="132" y="582" font-size="9.5" fill="#d1d5db">top FLUSH with rim</text>
  <!-- vent opening over the controller -->
  <rect x="120" y="522" width="154" height="98" rx="4" fill="none" stroke="#1d4ed8" stroke-width="2.6" stroke-dasharray="7 4"/>
  <text x="284" y="556" font-size="10.5" font-weight="bold" fill="#1d4ed8">vent opening</text>
  <text x="284" y="570" font-size="10.5" fill="#1d4ed8">goes exactly here</text>

  <!-- lid footprint -->
  <rect x="94" y="332" width="308" height="360" rx="6" fill="none" stroke="#a16207" stroke-width="2.6" stroke-dasharray="9 5"/>
  <!-- mast -->
  <rect x="296" y="398" width="24" height="104" rx="2" fill="#cbd5e1" fill-opacity="0.94" stroke="#334155" stroke-width="2"/>
  <circle cx="308" cy="450" r="15" fill="#e2e8f0" stroke="#334155" stroke-width="2.4"/>
  <circle cx="308" cy="450" r="5" fill="#334155"/>
  <text x="300" y="384" font-size="10.5" font-weight="bold" fill="#0f172a">mast</text>

  <text x="92" y="722" font-size="10.5" font-style="italic" fill="#92400e">
    Dashed gold = the plywood lid. It stops AT the rim on every edge.
  </text>
  <text x="92" y="740" font-size="10.5" font-style="italic" fill="#b91c1c">
    Overhang the front edge and you bury the charge port under a plate with a mast on it.
  </text>

  <!-- ================= PANEL B : section ================= -->
  <rect x="486" y="76" width="590" height="364" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="506" y="102" font-size="14.5" font-weight="bold" fill="#92400e">B · Side section — what D10 settles</text>

  <!-- footwell floor -->
  <line x1="520" y1="330" x2="700" y2="330" stroke="#2563eb" stroke-width="3"/>
  <text x="528" y="350" font-size="11" font-weight="bold" fill="#1e3a8a">footwell floor</text>
  <rect x="534" y="296" width="70" height="34" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="542" y="318" font-size="10" fill="#1e3a8a">MDDS30</text>

  <!-- dividing wall + charge port -->
  <path d="M700,330 L700,250" stroke="#111827" stroke-width="2.6"/>
  <rect x="688" y="286" width="13" height="22" rx="2" fill="#fecaca" stroke="#b91c1c" stroke-width="2.2"/>
  <path d="M672,297 L686,297" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="592" y="282" font-size="10.5" font-weight="bold" fill="#b91c1c">charge port,</text>
  <text x="592" y="295" font-size="10.5" font-weight="bold" fill="#b91c1c">reached from here</text>

  <!-- bay -->
  <path d="M700,250 L700,372 L1044,372 L1044,250" fill="none" stroke="#111827" stroke-width="2.6"/>
  <rect x="686" y="250" width="28" height="12" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect x="1016" y="250" width="28" height="12" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="652" y="246" font-size="10.5" font-weight="bold" fill="#b45309">rim</text>
  <text x="1048" y="246" font-size="10.5" font-weight="bold" fill="#b45309">rim</text>

  <!-- battery : spare depth -->
  <rect x="736" y="292" width="118" height="80" rx="3" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <text x="752" y="338" font-size="10.5" font-weight="bold" fill="#e5e7eb">battery</text>
  <g stroke="#15803d" stroke-width="1.6">
    <line x1="795" y1="286" x2="795" y2="256" marker-end="url(#ag)"/>
  </g>
  <text x="700" y="224" font-size="10.5" font-weight="bold" fill="#15803d">spare depth — nothing to clear</text>
  <path d="M770,230 L792,278" stroke="#15803d" stroke-width="1.3" marker-end="url(#ag)"/>

  <!-- controller : flush with the rim -->
  <rect x="898" y="250" width="104" height="122" rx="3" fill="#4b5563" stroke="#d1d5db" stroke-width="2"/>
  <text x="912" y="320" font-size="10.5" font-weight="bold" fill="#f3f4f6">controller</text>
  <line x1="686" y1="250" x2="1044" y2="250" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="890" y="396" font-size="10.5" font-weight="bold" fill="#111827">top FLUSH with the rim plane</text>

  <!-- lid, in two pieces with the vent opening between -->
  <rect x="686" y="238" width="206" height="12" fill="url(#ply)" stroke="#a16207" stroke-width="1.9"/>
  <rect x="1008" y="238" width="36" height="12" fill="url(#ply)" stroke="#a16207" stroke-width="1.9"/>
  <line x1="892" y1="244" x2="1008" y2="244" stroke="#1d4ed8" stroke-width="2.6" stroke-dasharray="7 5"/>
  <text x="884" y="212" font-size="11" font-weight="bold" fill="#1d4ed8">VENT OPENING, over the controller</text>
  <text x="884" y="226" font-size="10.5" fill="#1d4ed8">clearance and cooling from one cut</text>

  <!-- load arrows at the rim -->
  <path d="M700,266 L700,282" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
  <path d="M1030,282 L1030,266" stroke="#f59e0b" stroke-width="3" marker-end="url(#a)"/>

  <!-- mast -->
  <rect x="742" y="226" width="118" height="12" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <rect x="796" y="150" width="11" height="76" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <path d="M801,148 L801,134" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="816" y="166" font-size="10.5" fill="#334155">post 500</text>
  <text x="700" y="186" font-size="10.5" fill="#475569">base rail 250 — over the battery side, not the controller</text>

  <text x="506" y="420" font-size="12" fill="#78350f">
    <tspan font-weight="bold">The lid bears on the rim and nowhere else.</tspan> The controller is an electronic part, not a structural one.
  </text>

  <!-- ================= PANEL C ================= -->
  <rect x="486" y="456" width="590" height="306" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="506" y="482" font-size="14.5" font-weight="bold" fill="#14532d">C · Answered — and three rules fall out</text>

  <text x="506" y="510" font-size="12" font-weight="bold" fill="#15803d">D8 · Charge port is on the wall between bay and footwell.</text>
  <text x="520" y="528" font-size="11" fill="#166534">→ <tspan font-weight="bold">The lid must stop at the rim on every edge.</tspan> No overhang into the footwell.</text>
  <text x="520" y="544" font-size="11" fill="#166534">→ Keep the plug's approach clear: the MDDS30 does not sit in front of the port.</text>

  <text x="506" y="572" font-size="12" font-weight="bold" fill="#15803d">D9 · No breaker or switch inside the bay.</text>
  <text x="520" y="590" font-size="11" fill="#166534">→ With D8, <tspan font-weight="bold">the bay never needs routine opening. The mast on the lid is confirmed.</tspan></text>

  <text x="506" y="618" font-size="12" font-weight="bold" fill="#15803d">D10 · Battery has spare depth; controller top is flush with the rim.</text>
  <text x="520" y="636" font-size="11" fill="#166534">→ <tspan font-weight="bold">Put the vent opening over the controller.</tspan> One cut gives clearance and cooling,</text>
  <text x="534" y="652" font-size="11" fill="#166534">and puts the venting exactly where the heat is made.</text>
  <text x="520" y="668" font-size="11" fill="#166534">→ Keep the base rail over the battery side, so no load path reaches the controller.</text>

  <rect x="506" y="686" width="550" height="56" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="520" y="707" font-size="11.5" font-weight="bold" fill="#14532d">Still open: D2 bolt pattern · D3 rim-to-rim rectangle · D4 footwell floor</text>
  <text x="520" y="726" font-size="11.5" fill="#166534">D5 harness anchors · D6 step height · D7 side-wall height. <tspan font-weight="bold">D3 is the one that cuts plywood.</tspan></text>
</svg>
