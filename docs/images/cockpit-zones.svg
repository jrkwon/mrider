<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>The seat was a lid over the battery bay — so the equipment plate becomes a better lid</title>
  <desc>Left: a plan view of the cockpit with the seat removed, showing the battery and stock
  controller sitting in an open bay whose walls finish in a continuous flat rim, and the flat
  footwell ahead of it. Right top: a side section comparing the rejected arrangement, a plate
  carried on four moulded bosses, with the adopted one, a plate bearing on the continuous rim so
  that a tipping moment is taken in compression by the rim and the bolts only resist lift. Right
  bottom: the three consequences that come with covering the bay and the questions still open.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#15803d"/>
    </marker>
    <pattern id="mat" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eaf0f7"/>
      <path d="M0,10 L5,5 L10,10" fill="none" stroke="#b8c6d6" stroke-width="1.1"/>
    </pattern>
    <pattern id="ply" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#fde8c8"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#d9a259" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="760" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">
    The seat was a LID over the battery bay — so build a better lid
  </text>
  <text x="24" y="56" font-size="13" fill="#475569">
    Corrected from the 2026-10-19 teardown photograph. This is simpler than four standoffs, and it is also structurally stronger.
  </text>

  <!-- ================= PANEL A : plan ================= -->
  <rect x="24" y="76" width="446" height="648" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="102" font-size="14.5" font-weight="bold" fill="#0f172a">A · Seat removed — plan view</text>

  <rect x="70" y="124" width="356" height="572" rx="18" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <text x="222" y="116" font-size="11.5" font-weight="bold" fill="#475569">FRONT</text>
  <path d="M250,120 L250,100" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- footwell -->
  <rect x="88" y="142" width="320" height="156" rx="6" fill="url(#mat)" stroke="#2563eb" stroke-width="2.2"/>
  <text x="104" y="166" font-size="12.5" font-weight="bold" fill="#1e3a8a">footwell — flat, low, free</text>
  <text x="104" y="184" font-size="10.5" fill="#1d4ed8">keep it for the motor driver: the MDDS30 wants</text>
  <text x="104" y="199" font-size="10.5" fill="#1d4ed8">open air and is awkward to enclose anywhere</text>
  <circle cx="300" cy="248" r="14" fill="none" stroke="#64748b" stroke-width="2.4"/>
  <circle cx="300" cy="248" r="4" fill="#64748b"/>
  <text x="322" y="244" font-size="10.5" fill="#64748b">column</text>
  <text x="322" y="257" font-size="10.5" fill="#64748b">keep-out</text>

  <!-- the bay : rim band + interior -->
  <rect x="88" y="318" width="320" height="360" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <rect x="106" y="336" width="284" height="324" rx="5" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="112" y="310" font-size="12.5" font-weight="bold" fill="#92400e">the bay — and its continuous RIM (yellow)</text>

  <!-- battery + controller inside -->
  <rect x="128" y="372" width="146" height="130" rx="4" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <text x="140" y="442" font-size="11.5" font-weight="bold" fill="#e5e7eb">traction battery</text>
  <rect x="128" y="520" width="146" height="78" rx="4" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <text x="140" y="564" font-size="11" font-weight="bold" fill="#e5e7eb">stock controller</text>
  <path d="M278,430 q28,24 8,60 q-20,36 14,62" fill="none" stroke="#ef4444" stroke-width="2.4"/>
  <circle cx="300" cy="552" r="6" fill="#ef4444"/>
  <text x="290" y="620" font-size="10.5" font-weight="bold" fill="#fca5a5">harness + connector</text>

  <!-- cover footprint -->
  <rect x="94" y="324" width="308" height="348" rx="6" fill="none" stroke="#a16207" stroke-width="2.6" stroke-dasharray="9 5"/>
  <!-- mast rail footprint -->
  <rect x="234" y="470" width="24" height="104" rx="2" fill="#cbd5e1" fill-opacity="0.92" stroke="#334155" stroke-width="2"/>
  <circle cx="246" cy="522" r="15" fill="#e2e8f0" stroke="#334155" stroke-width="2.4"/>
  <circle cx="246" cy="522" r="5" fill="#334155"/>
  <text x="268" y="500" font-size="11" font-weight="bold" fill="#0f172a">mast, on the lid</text>
  <text x="268" y="515" font-size="10.5" fill="#475569">base rail 250 mm</text>

  <text x="92" y="700" font-size="10.5" font-style="italic" fill="#92400e">
    Dashed line = the plywood cover. One rectangle, one cut, one measurement.
  </text>

  <!-- ================= PANEL B : section ================= -->
  <rect x="486" y="76" width="590" height="352" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="506" y="102" font-size="14.5" font-weight="bold" fill="#92400e">B · Why the lid is also the stronger answer</text>

  <!-- REJECTED : four bosses -->
  <text x="506" y="128" font-size="11.5" font-weight="bold" fill="#b91c1c">✗ what I proposed — plate on four moulded bosses</text>
  <rect x="520" y="186" width="200" height="8" fill="url(#ply)" stroke="#a16207" stroke-width="1.5"/>
  <rect x="540" y="194" width="12" height="22" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
  <rect x="688" y="194" width="12" height="22" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
  <path d="M520,216 L720,216" stroke="#7e22ce" stroke-width="2.4"/>
  <rect x="612" y="144" width="9" height="42" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
  <path d="M616,142 L616,132" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M546,228 L546,252" stroke="#b91c1c" stroke-width="2.6" marker-end="url(#ar)"/>
  <path d="M694,252 L694,228" stroke="#b91c1c" stroke-width="2.6" marker-end="url(#ar)"/>
  <text x="506" y="274" font-size="11" fill="#7f1d1d">The whole moment lands as <tspan font-weight="bold">pull-out on two plastic bosses.</tspan></text>
  <text x="506" y="290" font-size="11" fill="#7f1d1d">And the plate rocks on whatever the moulding does between them.</text>

  <!-- ADOPTED : bearing on the rim -->
  <text x="784" y="128" font-size="11.5" font-weight="bold" fill="#15803d">✓ the lid — plate bearing on the continuous rim</text>
  <!-- bay walls -->
  <path d="M800,216 L800,300 L1040,300 L1040,216" fill="none" stroke="#111827" stroke-width="2.4"/>
  <rect x="786" y="206" width="30" height="11" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect x="1024" y="206" width="30" height="11" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect x="806" y="246" width="100" height="54" rx="3" fill="#374151" stroke="#9ca3af" stroke-width="1.8"/>
  <text x="814" y="278" font-size="10" fill="#e5e7eb">battery</text>
  <rect x="786" y="196" width="268" height="10" fill="url(#ply)" stroke="#a16207" stroke-width="1.8"/>
  <!-- vent slots -->
  <g stroke="#1d4ed8" stroke-width="2.2">
    <line x1="938" y1="198" x2="938" y2="204"/>
    <line x1="952" y1="198" x2="952" y2="204"/>
    <line x1="966" y1="198" x2="966" y2="204"/>
    <line x1="980" y1="198" x2="980" y2="204"/>
  </g>
  <text x="930" y="188" font-size="10" font-weight="bold" fill="#1d4ed8">vent slots</text>
  <rect x="898" y="150" width="9" height="46" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
  <path d="M902,148 L902,136" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- load arrows -->
  <path d="M800,224 L800,240" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
  <text x="742" y="246" font-size="10.5" font-weight="bold" fill="#15803d">rim takes it</text>
  <text x="742" y="259" font-size="10.5" font-weight="bold" fill="#15803d">in COMPRESSION</text>
  <path d="M1040,240 L1040,224" stroke="#f59e0b" stroke-width="3" marker-end="url(#a)"/>
  <text x="1046" y="248" font-size="10.5" font-weight="bold" fill="#b45309">bolt</text>
  <text x="1046" y="261" font-size="10.5" font-weight="bold" fill="#b45309">only lifts</text>

  <text x="506" y="322" font-size="12" fill="#78350f">
    <tspan font-weight="bold">The pivot moves from a boss to the rim edge.</tspan> One side of the moment is then carried by a continuous
  </text>
  <text x="506" y="340" font-size="12" fill="#78350f">
    plastic edge in compression — where plastic is strong — and only the lifting side reaches a fastener at all.
  </text>
  <text x="506" y="362" font-size="12" fill="#78350f">
    The four individually-measured standoffs disappear: the rim is already one flat plane. <tspan font-weight="bold">So does the rocking.</tspan>
  </text>
  <text x="506" y="390" font-size="12" font-weight="bold" fill="#92400e">
    Simpler AND stronger is rare. Take it.
  </text>
  <text x="506" y="410" font-size="11" fill="#a16207">
    Keep the 250 mm base rail anyway — it stops the post foot crushing a local patch of 12 mm plywood.
  </text>

  <!-- ================= PANEL C : consequences ================= -->
  <rect x="486" y="444" width="590" height="280" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="506" y="470" font-size="14.5" font-weight="bold" fill="#7f1d1d">C · Three things that come with covering the bay</text>

  <text x="506" y="498" font-size="12" font-weight="bold" fill="#991b1b">1 · It is now a thermal enclosure. Slot it.</text>
  <text x="520" y="516" font-size="11" fill="#7f1d1d">The traction battery and the stock controller both dissipate in there. Vent slots</text>
  <text x="520" y="532" font-size="11" fill="#7f1d1d">cost nothing in plywood; discovering the omission costs a battery.</text>

  <text x="506" y="560" font-size="12" font-weight="bold" fill="#991b1b">2 · The mast now rides on a removable panel.</text>
  <text x="520" y="578" font-size="11" fill="#7f1d1d">That is fine — and it is good, if servicing means lifting one assembly off after</text>
  <text x="520" y="594" font-size="11" fill="#7f1d1d">pulling two connectors. Build the loom so that is true: connectors, not splices.</text>

  <text x="506" y="622" font-size="12" font-weight="bold" fill="#991b1b">3 · Two questions decide how often it comes off.</text>
  <text x="520" y="640" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">D8</tspan> — is there an EXTERNAL charge port, or must the bay open to charge?</text>
  <text x="520" y="656" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">D9</tspan> — is there a resettable breaker or switch inside that must stay reachable?</text>
  <text x="520" y="676" font-size="11" fill="#b91c1c" font-style="italic">If either says the bay opens weekly, the mast moves to the footwell instead.</text>

  <text x="506" y="706" font-size="11.5" font-weight="bold" fill="#15803d">
    D1 is retired — no standoffs. D3 becomes one number: the rim-to-rim rectangle.
  </text>
</svg>
