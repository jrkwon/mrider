<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Fit check — the 250 mm rail does not fit a 210 mm deep bay</title>
  <desc>Left: the measured bay, 370 mm across by 210 mm fore-aft, drawn to scale, with the proposed
  250 by 250 base ghosted over it showing a 20 mm overhang off each fore-aft edge, and the corrected
  210 by 300 base drawn solid — its lateral tie-downs landing exactly on the existing seat screws
  300 mm apart, and its fore-aft ends landing on the bay's rim. Right: the measurements, the verdict
  on each part, the revised cut list from the same purchase, and the two numbers still missing.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1120" height="760" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">
    Fit check — you are right: 250 does not go into 210
  </text>
  <text x="24" y="56" font-size="13" fill="#475569">
    Bay drawn to scale from the 2026-10-20 measurements. Plan view, vehicle front at the bottom.
  </text>

  <!-- ================= PANEL A ================= -->
  <rect x="24" y="76" width="586" height="596" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ghosted 250 x 250 base -->
  <rect x="145" y="155" width="312" height="312" fill="#fecaca" fill-opacity="0.45"
        stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="9 5"/>
  <text x="150" y="146" font-size="11.5" font-weight="bold" fill="#b91c1c">proposed 250 × 250 — overhangs</text>

  <!-- the bay -->
  <rect x="70" y="180" width="462" height="262" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <rect x="86" y="196" width="430" height="230" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="300" y="320" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="middle">the bay</text>
  <text x="300" y="338" font-size="11" fill="#6b7280" text-anchor="middle">370 × 210 × 130 deep</text>

  <!-- overhang call-outs -->
  <path d="M470,155 L470,180" stroke="#b91c1c" stroke-width="2.6"/>
  <path d="M470,442 L470,467" stroke="#b91c1c" stroke-width="2.6"/>
  <text x="482" y="170" font-size="11" font-weight="bold" fill="#b91c1c">20 off the edge</text>
  <text x="482" y="460" font-size="11" font-weight="bold" fill="#b91c1c">20 off the edge</text>

  <!-- corrected base : 210 fore-aft x 300 lateral -->
  <rect x="291" y="180" width="20" height="262" fill="#94a3b8" stroke="#1e293b" stroke-width="3"/>
  <rect x="113" y="301" width="178" height="20" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
  <rect x="311" y="301" width="178" height="20" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
  <rect x="291" y="301" width="20" height="20" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
  <circle cx="301" cy="311" r="5" fill="#0f172a"/>

  <!-- tie-downs : seat screws -->
  <g fill="#fecaca" stroke="#b91c1c" stroke-width="2.4">
    <circle cx="113" cy="311" r="8"/><circle cx="489" cy="311" r="8"/>
  </g>
  <text x="76" y="294" font-size="10.5" font-weight="bold" fill="#b91c1c">seat screw</text>
  <text x="458" y="294" font-size="10.5" font-weight="bold" fill="#b91c1c">seat screw</text>

  <!-- battery holes -->
  <g fill="#bbf7d0" stroke="#15803d" stroke-width="2.4">
    <circle cx="301" cy="248" r="7"/><circle cx="301" cy="374" r="7"/>
  </g>
  <text x="318" y="246" font-size="10.5" font-weight="bold" fill="#15803d">battery holes, 100 apart</text>

  <!-- rail end tie-downs -->
  <g fill="#fde68a" stroke="#b45309" stroke-width="2.2">
    <circle cx="301" cy="192" r="6"/><circle cx="301" cy="430" r="6"/>
  </g>

  <!-- dimensions -->
  <g stroke="#15803d" stroke-width="1.6">
    <line x1="113" y1="500" x2="489" y2="500"/>
    <line x1="113" y1="494" x2="113" y2="506"/>
    <line x1="489" y1="494" x2="489" y2="506"/>
  </g>
  <text x="248" y="518" font-size="12" font-weight="bold" fill="#15803d">300 lateral</text>

  <g stroke="#15803d" stroke-width="1.6">
    <line x1="560" y1="180" x2="560" y2="442"/>
    <line x1="554" y1="180" x2="566" y2="180"/>
    <line x1="554" y1="442" x2="566" y2="442"/>
  </g>
  <text x="540" y="318" font-size="12" font-weight="bold" fill="#15803d" transform="rotate(-90 540 318)">210 fore-aft</text>

  <g stroke="#64748b" stroke-width="1.3">
    <line x1="70" y1="160" x2="532" y2="160"/>
    <line x1="70" y1="154" x2="70" y2="166"/>
    <line x1="532" y1="154" x2="532" y2="166"/>
  </g>
  <text x="272" y="134" font-size="11.5" font-weight="bold" fill="#475569">370</text>

  <rect x="48" y="540" width="538" height="116" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="64" y="562" font-size="12.5" font-weight="bold" fill="#14532d">The fix rotates the geometry — and lands two bolts for free</text>
  <text x="64" y="582" font-size="11.5" fill="#166534">The <tspan font-weight="bold">lateral stubs at ~140 put their tie-down bolts exactly on the existing seat screws</tspan>,</text>
  <text x="64" y="599" font-size="11.5" fill="#166534">which are 300 apart. No new holes in that direction, and the span goes <tspan font-weight="bold">up</tspan> from 250 to 300.</text>
  <text x="64" y="621" font-size="11.5" fill="#166534">The fore-aft rail shortens to <tspan font-weight="bold">210</tspan> and its ends land on the bay's rim, where the lid is</text>
  <text x="64" y="638" font-size="11.5" fill="#166534">supported anyway. <tspan font-weight="bold">The lid itself was never the problem — it is simply the size of the hole.</tspan></text>

  <!-- ================= PANEL B ================= -->
  <rect x="626" y="76" width="470" height="326" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="646" y="102" font-size="14.5" font-weight="bold" fill="#92400e">Measured, and the verdict on each part</text>

  <text x="646" y="130" font-size="11.5" font-weight="bold" fill="#78350f">Bay 370 × 210, 130 deep · rim to body top 130</text>
  <text x="646" y="148" font-size="11.5" font-weight="bold" fill="#78350f">Seat screws 300 apart · battery holes 100 apart</text>
  <line x1="646" y1="160" x2="1076" y2="160" stroke="#fcd34d" stroke-width="1.5"/>

  <text x="646" y="184" font-size="12" font-weight="bold" fill="#b91c1c">✗ 250 fore-aft rail — 40 too long</text>
  <text x="660" y="201" font-size="11" fill="#7f1d1d">20 mm hangs off each fore-aft edge, so its end bolts</text>
  <text x="660" y="216" font-size="11" fill="#7f1d1d">would land on nothing. <tspan font-weight="bold">Shorten to 210.</tspan></text>

  <text x="646" y="244" font-size="12" font-weight="bold" fill="#15803d">✓ the lid — correct as it stands</text>
  <text x="660" y="261" font-size="11" fill="#166534">It is the size of the opening it covers, ~390 × 230 with</text>
  <text x="660" y="276" font-size="11" fill="#166534">the rim. Nothing to shrink.</text>

  <text x="646" y="304" font-size="12" font-weight="bold" fill="#b45309">⚠ the battery-hole pillars — reframed</text>
  <text x="660" y="321" font-size="11" fill="#78350f">At <tspan font-weight="bold">100 mm apart they are too close to be the mast's</tspan></text>
  <text x="660" y="336" font-size="11" fill="#78350f"><tspan font-weight="bold">couple</tspan> — 54 N·m across 0.1 m is 540 N a side. They are</text>
  <text x="660" y="351" font-size="11" fill="#78350f">local support: they stop the lid dishing under the post.</text>
  <text x="660" y="370" font-size="11" fill="#78350f">The couple is the <tspan font-weight="bold">rim in compression</tspan> plus the</text>
  <text x="660" y="385" font-size="11" fill="#78350f">perimeter bolts in lift, as before.</text>

  <!-- ================= PANEL C ================= -->
  <rect x="626" y="418" width="470" height="254" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="646" y="444" font-size="14.5" font-weight="bold" fill="#14532d">Revised cut list — same purchase</text>

  <text x="646" y="470" font-size="11.5" font-weight="bold" fill="#166534">700 mm → post 500 + boom 150 (50 spare)</text>
  <text x="646" y="490" font-size="11.5" font-weight="bold" fill="#166534">600 mm → rail 210 + stub 140 + stub 140 (110 spare)</text>
  <text x="646" y="510" font-size="11" fill="#15803d">₩9,100 per vehicle, unchanged. Only the cuts move.</text>

  <text x="646" y="540" font-size="12" font-weight="bold" fill="#14532d">Loads at the new spans</text>
  <text x="646" y="559" font-size="11" fill="#166534">driving, 1 g kerb: <tspan font-weight="bold">±13 N fore-aft, ±9 N lateral</tspan> — nothing</text>
  <text x="646" y="576" font-size="11" fill="#166534">10 kgf lean: <tspan font-weight="bold">±257 N fore-aft, ±180 N lateral</tspan></text>
  <text x="646" y="593" font-size="11" fill="#15803d">The short direction is also the loaded one, which is why the</text>
  <text x="646" y="608" font-size="11" fill="#15803d">continuous rail stays fore-aft. <tspan font-weight="bold">NOT A HANDLE still applies.</tspan></text>

  <rect x="646" y="620" width="430" height="42" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="658" y="638" font-size="11.5" font-weight="bold" fill="#92400e">Still missing: the seat screws' FORE-AFT spacing,</text>
  <text x="658" y="654" font-size="11.5" font-weight="bold" fill="#92400e">and the rim's width. Both size the lid's hold-down.</text>
</svg>
