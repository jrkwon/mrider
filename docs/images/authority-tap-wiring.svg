<text x="44" y="742" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="start">Tabs keyed 90° apart — this plug cannot go in REVERSED. It CAN be swapped with the power tap: same .250, same key. See FMEA row 12.</text>
<text x="24" y="806" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="start">Restoring the vehicle: unplug MRider’s two assemblies and put the vehicle’s own plugs back on the module. No conductor was cut.</text>
<text x="24" y="828" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Per vehicle: 2 taps × (2 female + 2 male) = 4 female + 4 male. Three vehicles: 12 female, 12 male, plus spares. The POWER tap is a third .250 pair, drawn in traction-supply.svg.</text>
<text x="24" y="848" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Steering, full numbers: 43645-0200 housing + 43030-0001 terminals towards the module; 43640-0200 + 43031-0001 towards the plug. Drive and power: .250 uninsulated, 16–14 AWG.</text>
</svg>