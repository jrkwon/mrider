<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title>Authority tap wiring - which connector half goes on which end</title>
<desc>Each motor conductor runs from a tab on the stock module, through a receptacle MRider supplies, into a relay on 87a; the relay's 30 leaves on a tab MRider supplies and enters the vehicle's own plug on its way to the motor. The motor driver feeds 87. Nothing is cut: both taps are connectors the vehicle already has.</desc>
<defs><marker id="a047857" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L9,3.2 z" fill="#047857"/></marker><marker id="a1d4ed8" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L9,3.2 z" fill="#1d4ed8"/></marker><marker id="a334155" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L9,3.2 z" fill="#334155"/></marker><marker id="a64748b" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L9,3.2 z" fill="#64748b"/></marker><marker id="a7e22ce" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L9,3.2 z" fill="#7e22ce"/></marker><marker id="a92400e" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L9,3.2 z" fill="#92400e"/></marker></defs>
<rect width="1300" height="880" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="start">Authority tap wiring — nothing is cut, and each half is the gender opposite to the thing it mates</text>
<text x="24" y="58" font-size="12.5" fill="#475569"><tspan font-weight="bold" fill="#64748b">Grey = the vehicle’s own parts.</tspan><tspan font-weight="bold" fill="#047857">  Green = what MRider buys.</tspan><tspan font-weight="bold" fill="#7e22ce">  Purple = the motor driver.</tspan>  Coil off → 30 sits on 87a → the vehicle is factory stock.</text>
