<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>The four spare battery-fixing holes are the mast's load path into the chassis</title>
  <desc>Left: the bay as photographed, with the battery held by a strap that uses only one of the
  three screw holes moulded into each side, leaving four spare; the stock controller's cover at the
  right rear under three bolts; and the external charge port on the front wall. Right top: a side
  section showing printed pillars standing on those spare holes and reaching the underside of the
  lid, through-bolted so the mast's load runs bolt, pillar, boss, chassis — with the plywood merely
  sandwiched. Right bottom: the two measurements this needs and the two things it must not disturb.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#15803d"/>
    </marker>
    <pattern id="ply" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#fde8c8"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#d9a259" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="740" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">
    Four spare screw holes the vehicle already has — and they beat everything else in the bay
  </text>
  <text x="24" y="56" font-size="13" fill="#475569">
    Corrected 2026-10-19: there are <tspan font-weight="bold">no fore-aft supports</tspan>. What there is, is better. Front at the top.
  </text>

  <!-- ================= PANEL A ================= -->
  <rect x="24" y="76" width="446" height="640" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="102" font-size="14.5" font-weight="bold" fill="#0f172a">A · The bay, seat removed</text>

  <rect x="70" y="136" width="360" height="516" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="212" y="128" font-size="11" font-weight="bold" fill="#b45309">continuous rim</text>
  <rect x="88" y="154" width="324" height="480" rx="5" fill="#1f2937" stroke="#111827" stroke-width="2"/>

  <!-- charge port -->
  <rect x="178" y="136" width="36" height="18" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="222" y="150" font-size="10.5" font-weight="bold" fill="#b91c1c">charge port</text>

  <!-- seat mounts -->
  <g fill="#fca5a5" stroke="#b91c1c" stroke-width="2">
    <circle cx="104" cy="172" r="6"/><circle cx="396" cy="172" r="6"/>
    <circle cx="104" cy="616" r="6"/><circle cx="396" cy="616" r="6"/>
  </g>
  <text x="92" y="194" font-size="9.5" font-weight="bold" fill="#fca5a5">seat mounts — D2</text>

  <!-- battery -->
  <rect x="176" y="252" width="128" height="176" rx="4" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <text x="206" y="334" font-size="12" font-weight="bold" fill="#e5e7eb">battery</text>
  <text x="184" y="352" font-size="9.5" fill="#9ca3af">spare depth above</text>
  <!-- retaining strap -->
  <rect x="228" y="232" width="24" height="216" rx="3" fill="#9ca3af" stroke="#e5e7eb" stroke-width="2"/>
  <text x="258" y="244" font-size="9.5" font-weight="bold" fill="#d1d5db">strap</text>

  <!-- three holes each side : middle one USED -->
  <g>
    <!-- left column -->
    <circle cx="150" cy="268" r="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2.6"/>
    <circle cx="150" cy="340" r="8" fill="#6b7280" stroke="#d1d5db" stroke-width="2.4"/>
    <circle cx="150" cy="412" r="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2.6"/>
    <!-- right column -->
    <circle cx="330" cy="268" r="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2.6"/>
    <circle cx="330" cy="340" r="8" fill="#6b7280" stroke="#d1d5db" stroke-width="2.4"/>
    <circle cx="330" cy="412" r="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2.6"/>
  </g>
  <text x="96" y="236" font-size="10" font-weight="bold" fill="#15803d">SPARE ×4</text>
  <text x="96" y="452" font-size="10" font-weight="bold" fill="#15803d">SPARE</text>
  <text x="96" y="334" font-size="9.5" font-weight="bold" fill="#d1d5db">used</text>
  <text x="344" y="334" font-size="9.5" font-weight="bold" fill="#d1d5db">used</text>

  <!-- the rectangle they form -->
  <rect x="150" y="268" width="180" height="144" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="166" y="478" font-size="11" font-weight="bold" fill="#15803d">the four spare holes form a rectangle</text>
  <text x="166" y="493" font-size="10.5" fill="#15803d">— its size is D11, and it sets the base</text>

  <!-- controller cover -->
  <path d="M330,500 L394,500 L406,514 L406,616 L330,616 Z" fill="#4b5563" stroke="#e5e7eb" stroke-width="2.2"/>
  <g fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5">
    <circle cx="344" cy="514" r="4.5"/><circle cx="396" cy="536" r="4.5"/><circle cx="366" cy="604" r="4.5"/>
  </g>
  <text x="336" y="556" font-size="10.5" font-weight="bold" fill="#f3f4f6">controller</text>
  <text x="336" y="571" font-size="10.5" font-weight="bold" fill="#f3f4f6">cover</text>
  <text x="330" y="588" font-size="9" fill="#d1d5db">top flush w/ rim</text>

  <text x="92" y="684" font-size="10.5" font-style="italic" fill="#475569">
    These holes retain a battery against vehicle motion. They are engineered,
  </text>
  <text x="92" y="700" font-size="10.5" font-style="italic" fill="#475569">
    not incidental — the only such points inside the bay.
  </text>

  <!-- ================= PANEL B ================= -->
  <rect x="486" y="76" width="590" height="356" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="506" y="102" font-size="14.5" font-weight="bold" fill="#92400e">B · Section — the load path the spare holes buy</text>

  <!-- bay -->
  <path d="M620,246 L620,382 L1040,382 L1040,246" fill="none" stroke="#111827" stroke-width="2.6"/>
  <rect x="606" y="246" width="28" height="12" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect x="1026" y="246" width="28" height="12" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="566" y="242" font-size="10.5" font-weight="bold" fill="#b45309">rim</text>

  <!-- floor bosses -->
  <rect x="700" y="356" width="34" height="26" fill="#6b7280" stroke="#d1d5db" stroke-width="2"/>
  <rect x="922" y="356" width="34" height="26" fill="#6b7280" stroke="#d1d5db" stroke-width="2"/>
  <text x="664" y="400" font-size="10.5" font-weight="bold" fill="#111827">spare battery-fixing bosses</text>

  <!-- battery between -->
  <rect x="774" y="306" width="108" height="76" rx="3" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <text x="792" y="350" font-size="10.5" font-weight="bold" fill="#e5e7eb">battery</text>

  <!-- printed pillars -->
  <rect x="704" y="248" width="26" height="108" fill="#bbf7d0" stroke="#15803d" stroke-width="2.4"/>
  <rect x="926" y="248" width="26" height="108" fill="#bbf7d0" stroke="#15803d" stroke-width="2.4"/>
  <text x="596" y="300" font-size="11" font-weight="bold" fill="#15803d">printed</text>
  <text x="596" y="314" font-size="11" font-weight="bold" fill="#15803d">pillars</text>
  <text x="596" y="328" font-size="10" fill="#15803d">height = D12</text>
  <path d="M636,308 L700,300" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- lid -->
  <rect x="606" y="236" width="448" height="12" fill="url(#ply)" stroke="#a16207" stroke-width="1.9"/>

  <!-- base cross + post -->
  <rect x="690" y="222" width="276" height="14" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="2.2"/>
  <rect x="818" y="146" width="12" height="76" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <path d="M824,144 L824,130" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="840" y="160" font-size="10.5" fill="#334155">post</text>

  <!-- through bolts -->
  <g stroke="#b91c1c" stroke-width="2.8">
    <line x1="717" y1="218" x2="717" y2="368" marker-end="url(#ar)"/>
    <line x1="939" y1="218" x2="939" y2="368" marker-end="url(#ar)"/>
  </g>
  <circle cx="717" cy="216" r="5" fill="#b91c1c"/>
  <circle cx="939" cy="216" r="5" fill="#b91c1c"/>
  <text x="976" y="196" font-size="11" font-weight="bold" fill="#b91c1c">one bolt, top to bottom</text>

  <text x="506" y="422" font-size="12" fill="#78350f">
    <tspan font-weight="bold">bolt → base cross → lid → pillar → boss → chassis.</tspan> The plywood is in the sandwich, not in the load path.
  </text>

  <!-- ================= PANEL C ================= -->
  <rect x="486" y="448" width="590" height="268" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="506" y="474" font-size="14.5" font-weight="bold" fill="#14532d">C · What this needs, and what it must not disturb</text>

  <text x="506" y="502" font-size="12" fill="#166534"><tspan font-weight="bold" fill="#14532d">D11</tspan> — the four spare holes: thread size, and the rectangle they form</text>
  <text x="520" y="519" font-size="10.5" font-style="italic" fill="#15803d">→ this sets the base cross, so 250 × 250 stays provisional until it is measured</text>
  <text x="506" y="542" font-size="12" fill="#166534"><tspan font-weight="bold" fill="#14532d">D12</tspan> — depth from the rim plane down to each boss face</text>
  <text x="520" y="559" font-size="10.5" font-style="italic" fill="#15803d">→ the pillar heights. Measure all four; they need not be equal</text>

  <rect x="506" y="574" width="550" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="520" y="594" font-size="11.5" font-weight="bold" fill="#991b1b">Do not touch the strap's own screw, and keep the battery removable.</text>
  <text x="520" y="612" font-size="11" fill="#7f1d1d">A pillar that blocks the battery's way out has swapped one problem for a worse one —</text>
  <text x="520" y="627" font-size="11" fill="#7f1d1d">check the lift-out path before committing a height.</text>

  <text x="506" y="660" font-size="11.5" fill="#15803d">
    <tspan font-weight="bold">Why this is better than anything else on offer:</tspan> these holes are the only points inside the bay
  </text>
  <text x="506" y="677" font-size="11.5" fill="#15803d">
    engineered to hold something against vehicle motion, and they sit where the mast actually stands.
  </text>
  <text x="506" y="698" font-size="11.5" fill="#166534">
    The seat bolts then only have to hold the lid down. They stop being the mast's structure.
  </text>
</svg>
