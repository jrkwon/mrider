<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>The mast base: one continuous rail plus two butted stubs, because two crossing rails cannot share a plane</title>
  <desc>Left: the rejected single fore-aft rail, which gives a fore-aft base but only the 40 mm of
  its corner-bracket arms side-to-side. Centre: the adopted base, drawn as three separate pieces —
  one continuous 210 mm fore-aft rail with the post standing on it, and two separate 140 mm stubs
  butted against its left and right faces — with the derivation of 140 from the 300 mm lateral span
  less the bar's own 20 mm width, halved. Right top: why one of the two directions must be
  split, since two continuous 20 mm bars cannot occupy the same 20 mm layer where they cross. Right
  bottom: the cut list mapped piece by piece. Footer: why the base is symmetric in span but not in
  construction, and why the continuous member is placed fore-aft.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#15803d"/>
    </marker>
    <pattern id="ply" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#fde8c8"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#d9a259" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1120" height="790" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">
    The base is ONE continuous rail plus TWO butted stubs — not two crossing rails
  </text>
  <text x="24" y="56" font-size="13" fill="#475569">
    Plan view of the mast foot on the lid, front at the top. Three separate pieces, all 20 mm tall, all in one plane.
  </text>

  <!-- ================= LEFT : rejected ================= -->
  <rect x="24" y="76" width="306" height="430" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="44" y="102" font-size="14" font-weight="bold" fill="#7f1d1d">✗ a single rail on its own</text>

  <rect x="58" y="124" width="238" height="320" rx="5" fill="url(#ply)" stroke="#a16207" stroke-width="1.6"/>
  <rect x="160" y="160" width="34" height="250" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="2.2"/>
  <rect x="160" y="268" width="34" height="34" fill="#e2e8f0" stroke="#334155" stroke-width="2.6"/>
  <rect x="164" y="246" width="26" height="18" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <rect x="164" y="306" width="26" height="18" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <circle cx="177" cy="172" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="177" cy="398" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>

  <g stroke="#15803d" stroke-width="1.5">
    <line x1="222" y1="172" x2="222" y2="398"/>
    <line x1="216" y1="172" x2="228" y2="172"/>
    <line x1="216" y1="398" x2="228" y2="398"/>
  </g>
  <text x="232" y="282" font-size="11.5" font-weight="bold" fill="#15803d">210</text>
  <text x="232" y="296" font-size="10.5" fill="#15803d">fore-aft ✓</text>

  <g stroke="#b91c1c" stroke-width="1.5">
    <line x1="160" y1="340" x2="194" y2="340"/>
    <line x1="160" y1="334" x2="160" y2="346"/>
    <line x1="194" y1="334" x2="194" y2="346"/>
  </g>
  <path d="M118,352 L156,342" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="66" y="368" font-size="11.5" font-weight="bold" fill="#b91c1c">~40 only</text>
  <text x="66" y="383" font-size="10.5" fill="#b91c1c">bracket arms</text>

  <text x="44" y="472" font-size="11.5" fill="#7f1d1d">
    A 500 mm post on a 40 mm sideways
  </text>
  <text x="44" y="488" font-size="11.5" fill="#7f1d1d">
    base is a <tspan font-weight="bold">25 : 1 lever.</tspan>
  </text>

  <!-- ================= CENTRE : adopted ================= -->
  <rect x="346" y="76" width="392" height="430" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="366" y="102" font-size="14" font-weight="bold" fill="#14532d">✓ three pieces, one plane</text>

  <rect x="386" y="124" width="312" height="320" rx="5" fill="url(#ply)" stroke="#a16207" stroke-width="1.6"/>

  <!-- the ONE continuous rail -->
  <rect x="525" y="194" width="34" height="183" rx="2" fill="#94a3b8" stroke="#1e293b" stroke-width="3"/>
  <text x="566" y="182" font-size="11" font-weight="bold" fill="#1e293b">① RAIL 210 — continuous,</text>
  <text x="578" y="195" font-size="11" font-weight="bold" fill="#1e293b">the post stands ON it</text>

  <!-- TWO separate stubs, butted -->
  <rect x="409" y="268" width="114" height="34" rx="2" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
  <rect x="561" y="268" width="114" height="34" rx="2" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
  <line x1="524" y1="263" x2="524" y2="307" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="560" y1="263" x2="560" y2="307" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="392" y="256" font-size="11" font-weight="bold" fill="#1e293b">② STUB 140</text>
  <text x="600" y="256" font-size="11" font-weight="bold" fill="#1e293b">③ STUB 140</text>
  <text x="416" y="332" font-size="10" font-weight="bold" fill="#b91c1c">butted against the rail, not crossing it</text>

  <!-- post -->
  <rect x="525" y="268" width="34" height="34" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
  <circle cx="542" cy="285" r="6" fill="#0f172a"/>

  <!-- 4 brackets -->
  <rect x="529" y="246" width="26" height="18" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <rect x="529" y="306" width="26" height="18" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <rect x="501" y="276" width="18" height="26" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <rect x="565" y="276" width="18" height="26" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>

  <!-- tie-downs -->
  <g fill="#fecaca" stroke="#b91c1c" stroke-width="2">
    <circle cx="542" cy="206" r="6"/><circle cx="542" cy="364" r="6"/>
    <circle cx="421" cy="285" r="6"/><circle cx="663" cy="285" r="6"/>
  </g>

  <!-- spans -->
  <g stroke="#15803d" stroke-width="1.5">
    <line x1="421" y1="424" x2="663" y2="424"/>
    <line x1="421" y1="418" x2="421" y2="430"/>
    <line x1="663" y1="418" x2="663" y2="430"/>
  </g>
  <text x="476" y="440" font-size="11.5" font-weight="bold" fill="#15803d">300 lateral · 210 fore-aft</text>

  <rect x="366" y="456" width="352" height="40" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="380" y="473" font-size="12" font-weight="bold" fill="#14532d">Stub length = (300 − 20) ÷ 2 = 140</text>
  <text x="380" y="489" font-size="11" fill="#166534">the lateral span, less the rail's 20 mm width, halved</text>

  <!-- ================= RIGHT TOP ================= -->
  <rect x="754" y="76" width="342" height="248" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="774" y="102" font-size="14" font-weight="bold" fill="#92400e">Why one direction must be split</text>
  <text x="774" y="126" font-size="11.5" fill="#78350f">Two continuous bars crossing IS impossible:</text>

  <rect x="860" y="142" width="28" height="118" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <rect x="814" y="187" width="120" height="28" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <rect x="860" y="187" width="28" height="28" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
  <path d="M962,201 L896,201" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="966" y="193" font-size="11" font-weight="bold" fill="#b91c1c">two bars,</text>
  <text x="966" y="207" font-size="11" font-weight="bold" fill="#b91c1c">one 20 mm</text>
  <text x="966" y="221" font-size="11" font-weight="bold" fill="#b91c1c">layer</text>

  <text x="774" y="288" font-size="11.5" fill="#78350f">
    They would have to be stacked, which lifts the
  </text>
  <text x="774" y="304" font-size="11.5" fill="#78350f">
    post 20 mm and strands the brackets. <tspan font-weight="bold">So split one.</tspan>
  </text>

  <!-- ================= RIGHT BOTTOM ================= -->
  <rect x="754" y="340" width="342" height="166" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="774" y="366" font-size="14" font-weight="bold" fill="#0f172a">The 600 mm piece gives all three</text>

  <rect x="774" y="382" width="214" height="26" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <line x1="863" y1="376" x2="863" y2="414" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="904" y1="376" x2="904" y2="414" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="945" y1="376" x2="945" y2="414" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="792" y="400" font-size="10" font-weight="bold" fill="#0f172a">① 210</text>
  <text x="866" y="400" font-size="9" font-weight="bold" fill="#0f172a">② 140</text>
  <text x="907" y="400" font-size="9" font-weight="bold" fill="#0f172a">③ 140</text>
  <text x="950" y="400" font-size="9" fill="#15803d">110</text>

  <text x="774" y="434" font-size="11.5" fill="#334155">
    One rail only is <tspan font-weight="bold">correct, not short</tspan> — just
  </text>
  <text x="774" y="450" font-size="11.5" fill="#334155">
    the fore-aft member is continuous. The 700 mm
  </text>
  <text x="774" y="466" font-size="11.5" fill="#334155">
    piece separately gives post 500 + boom 150.
  </text>
  <text x="774" y="490" font-size="11" font-weight="bold" fill="#b45309">
    110 spare = one more stub if a cut goes wrong.
  </text>

  <!-- ================= FOOTER ================= -->
  <rect x="24" y="522" width="1072" height="246" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="44" y="548" font-size="13.5" font-weight="bold" fill="#0f172a">
    The honest part: the base is symmetric in SPAN, not in CONSTRUCTION — and the softer direction is chosen, not inherited
  </text>
  <text x="44" y="574" font-size="12" fill="#334155">
    Spans come from the measured bay: 210 fore-aft, 300 lateral on the existing seat screws. <tspan font-weight="bold">Fore-aft the post stands on a</tspan>
  </text>
  <text x="44" y="592" font-size="12" fill="#334155">
    <tspan font-weight="bold">continuous beam</tspan>, while <tspan font-weight="bold">sideways the load passes through two bracket joints.</tspan> Brackets are strong enough — 216 N through an M5 pair is
  </text>
  <text x="44" y="610" font-size="12" fill="#334155">
    nothing — but a bolted joint is never quite as stiff as unbroken metal.
  </text>

  <text x="44" y="640" font-size="12" font-weight="bold" fill="#15803d">
    The continuous member goes fore-aft because that is where the loads are:
  </text>
  <text x="58" y="660" font-size="12" fill="#166534">
    ■ braking and kerb strikes act front-to-back   ■ the camera boom overhangs forward, so its mass is a standing fore-aft moment
  </text>
  <text x="58" y="678" font-size="12" fill="#166534">
    ■ cornering is the only lateral case, this vehicle corners at walking pace — and lateral now has the longer 300 mm span anyway
  </text>

  <text x="44" y="708" font-size="12" fill="#334155">
    <tspan font-weight="bold">Four equal arms would be perfectly symmetric</tspan> — and strictly worse: all four joints would then be brackets, where this
  </text>
  <text x="44" y="726" font-size="12" fill="#334155">
    arrangement makes two of them unbroken metal, for the same part count and the same price.
  </text>
  <text x="44" y="752" font-size="12" font-weight="bold" fill="#b45309">
    Spans fixed 2026-10-20 by the measured bay (370 × 210) and the seat screws at 300. The 600 mm piece still leaves 110 mm spare.
  </text>
</svg>
