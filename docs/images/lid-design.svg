<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>The lid — a 320 by 215 rectangle, and the two fixings it does not have</title>
  <desc>Left: the lid drawn to scale at 320 by 215 mm, showing the two existing seat screws at
  10,25 and 310,25, the mast base of a 165 mm fore-aft rail and two 125 mm lateral stubs, four bolts
  in the rail of which the middle pair pass through the lid into printed pillars standing on the
  spare battery bosses, and the single bolt at each stub end. Right: why two fixings along one edge
  alone would let the lid hinge up at the other, how the pillar bolts become the second anchor pair,
  and the cut order for the plywood.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#15803d"/>
    </marker>
    <pattern id="ply" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#fdecd2"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#d9a259" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1180" height="800" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">
    The lid is a plain 320 × 215 rectangle — and it has fixings along one edge only
  </text>
  <text x="24" y="56" font-size="13" fill="#475569">
    Drawn to scale. Origin at the screwed edge's left corner. The curved raised ends of the opening sit outside this rectangle.
  </text>

  <!-- ================= PANEL A ================= -->
  <rect x="24" y="76" width="602" height="700" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- lid -->
  <rect x="90" y="150" width="432" height="290" fill="url(#ply)" stroke="#a16207" stroke-width="3"/>

  <!-- rail -->
  <rect x="292.5" y="183.75" width="27" height="222.75" fill="#94a3b8" stroke="#1e293b" stroke-width="2.6"/>
  <!-- stubs -->
  <rect x="123.75" y="281.6" width="168.75" height="27" fill="#cbd5e1" stroke="#1e293b" stroke-width="2.6"/>
  <rect x="319.5" y="281.6" width="168.75" height="27" fill="#cbd5e1" stroke="#1e293b" stroke-width="2.6"/>
  <!-- post -->
  <rect x="292.5" y="281.6" width="27" height="27" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
  <circle cx="306" cy="295" r="6" fill="#0f172a"/>

  <!-- existing seat screws -->
  <g fill="#fecaca" stroke="#b91c1c" stroke-width="2.8">
    <circle cx="103.5" cy="183.75" r="9"/><circle cx="508.5" cy="183.75" r="9"/>
  </g>
  <text x="112" y="172" font-size="11" font-weight="bold" fill="#b91c1c">(10, 25)</text>
  <text x="456" y="172" font-size="11" font-weight="bold" fill="#b91c1c">(310, 25)</text>
  <text x="196" y="138" font-size="12" font-weight="bold" fill="#b91c1c">the only two fixings the vehicle gives — 300 apart</text>

  <!-- pillar bolts : through the lid into the battery bosses -->
  <g fill="#bbf7d0" stroke="#15803d" stroke-width="2.8">
    <circle cx="306" cy="227.6" r="8"/><circle cx="306" cy="362.6" r="8"/>
  </g>
  <text x="326" y="222" font-size="11" font-weight="bold" fill="#15803d">bolt → lid → printed pillar → battery boss</text>
  <text x="326" y="236" font-size="10.5" fill="#15803d">100 apart. These become the SECOND anchor pair.</text>
  <text x="326" y="368" font-size="10.5" font-weight="bold" fill="#15803d">the far one does the work</text>

  <!-- rail end bolts into the lid -->
  <g fill="#fde68a" stroke="#b45309" stroke-width="2.4">
    <circle cx="306" cy="183.75" r="6"/><circle cx="306" cy="406.5" r="6"/>
  </g>
  <!-- stub end bolts -->
  <g fill="#fde68a" stroke="#b45309" stroke-width="2.4">
    <circle cx="123.75" cy="295" r="6"/><circle cx="488.25" cy="295" r="6"/>
  </g>
  <text x="112" y="322" font-size="10" font-weight="bold" fill="#b45309">penny washer under every amber bolt</text>

  <!-- dimensions -->
  <g stroke="#15803d" stroke-width="1.5">
    <line x1="123.75" y1="470" x2="488.25" y2="470"/>
    <line x1="123.75" y1="464" x2="123.75" y2="476"/><line x1="488.25" y1="464" x2="488.25" y2="476"/>
  </g>
  <text x="272" y="488" font-size="11.5" font-weight="bold" fill="#15803d">270</text>
  <g stroke="#15803d" stroke-width="1.5">
    <line x1="556" y1="183.75" x2="556" y2="406.5"/>
    <line x1="550" y1="183.75" x2="562" y2="183.75"/><line x1="550" y1="406.5" x2="562" y2="406.5"/>
  </g>
  <text x="566" y="300" font-size="11.5" font-weight="bold" fill="#15803d">165</text>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="90" y1="510" x2="522" y2="510"/>
    <line x1="90" y1="504" x2="90" y2="516"/><line x1="522" y1="504" x2="522" y2="516"/>
  </g>
  <text x="282" y="528" font-size="11.5" font-weight="bold" fill="#475569">320</text>

  <rect x="48" y="548" width="554" height="88" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="62" y="570" font-size="12.5" font-weight="bold" fill="#14532d">Four bolts in the rail, and the middle pair do two jobs</text>
  <text x="62" y="590" font-size="11.5" fill="#166534">The <tspan font-weight="bold">ends</tspan> bolt into the lid, 165 apart — that is the couple that resists the mast.</text>
  <text x="62" y="608" font-size="11.5" fill="#166534">The <tspan font-weight="bold">middle pair</tspan> drop through into the battery bosses — that is what stops the lid</text>
  <text x="62" y="626" font-size="11.5" fill="#166534">hinging up, and it costs two bolts that were going in anyway.</text>

  <rect x="48" y="650" width="554" height="108" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="62" y="672" font-size="12.5" font-weight="bold" fill="#92400e">Orientation matters: put the two screws at the REAR</text>
  <text x="62" y="692" font-size="11.5" fill="#78350f">The camera boom overhangs forward, so there is a <tspan font-weight="bold">permanent forward-tipping moment.</tspan></text>
  <text x="62" y="710" font-size="11.5" fill="#78350f">Forward lean presses the front edge down onto the rim and <tspan font-weight="bold">lifts the rear</tspan> — which is</text>
  <text x="62" y="728" font-size="11.5" fill="#78350f">exactly where the two screws are. Fit it the other way round and the standing load is</text>
  <text x="62" y="746" font-size="11.5" font-weight="bold" fill="#b45309">carried by the pillars alone, all day, every day.</text>

  <!-- ================= PANEL B ================= -->
  <rect x="642" y="76" width="514" height="362" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="662" y="102" font-size="14.5" font-weight="bold" fill="#7f1d1d">Two fixings on one edge is half a hold-down</text>

  <text x="662" y="128" font-size="11.5" fill="#7f1d1d">
    A lid bearing on a rim needs <tspan font-weight="bold">compression on one side and tension</tspan>
  </text>
  <text x="662" y="145" font-size="11.5" fill="#7f1d1d">
    <tspan font-weight="bold">on the other</tspan>. The rim supplies compression everywhere. Tension
  </text>
  <text x="662" y="162" font-size="11.5" fill="#7f1d1d">
    needs a fastener — and there are only two, both on one edge.
  </text>

  <!-- section : lean away from screws -->
  <text x="662" y="194" font-size="11.5" font-weight="bold" fill="#15803d">✓ mast leans away from the screws</text>
  <line x1="672" y1="248" x2="872" y2="248" stroke="#a16207" stroke-width="7"/>
  <rect x="762" y="208" width="9" height="40" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
  <path d="M770,214 L800,206" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="676" cy="248" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <path d="M676,262 L676,278" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#ar)"/>
  <path d="M868,278 L868,262" stroke="#15803d" stroke-width="2.4" marker-end="url(#ag)"/>
  <text x="640" y="296" font-size="10.5" font-weight="bold" fill="#b91c1c">screws hold</text>
  <text x="836" y="296" font-size="10.5" font-weight="bold" fill="#15803d">rim holds</text>

  <!-- section : lean toward screws -->
  <text x="662" y="330" font-size="11.5" font-weight="bold" fill="#b91c1c">✗ mast leans toward the screws</text>
  <path d="M672,384 L790,384 L872,368" stroke="#a16207" stroke-width="7" fill="none"/>
  <rect x="762" y="344" width="9" height="40" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
  <path d="M764,350 L734,342" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="676" cy="384" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <path d="M872,360 L872,342" stroke="#b91c1c" stroke-width="3" marker-end="url(#ar)"/>
  <text x="882" y="352" font-size="11" font-weight="bold" fill="#b91c1c">lifts —</text>
  <text x="882" y="366" font-size="11" font-weight="bold" fill="#b91c1c">nothing there</text>

  <text x="662" y="416" font-size="12" font-weight="bold" fill="#15803d">
    Fix: the two battery bosses become the second pair.
  </text>

  <!-- ================= PANEL C ================= -->
  <rect x="642" y="454" width="514" height="322" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="662" y="480" font-size="14.5" font-weight="bold" fill="#14532d">Cut order — the seller cuts free</text>

  <rect x="662" y="494" width="474" height="58" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="676" y="518" font-size="15" font-weight="bold" fill="#14532d">320 × 215 mm · 12 mm · FOUR pieces</text>
  <text x="676" y="540" font-size="11.5" fill="#166534">Four, not three — thirteen students, and one lid will be ruined.</text>

  <text x="662" y="578" font-size="11.5" fill="#166534">Four pieces stack in a <tspan font-weight="bold">320 × 860</tspan> column of the 600 × 1200 board,</text>
  <text x="662" y="595" font-size="11.5" fill="#166534">so 280 × 1200 of offcut survives for enclosure backing and test cuts.</text>

  <text x="662" y="624" font-size="12" font-weight="bold" fill="#14532d">If the cut comes out a millimetre proud, sand it.</text>
  <text x="662" y="642" font-size="11.5" fill="#166534">A millimetre undersize is harmless — the rim is 10–20 mm wide, so the</text>
  <text x="662" y="659" font-size="11.5" fill="#166534">lid still bears. Oversize is the only error that stops it dropping in.</text>

  <line x1="662" y1="676" x2="1136" y2="676" stroke="#bbf7d0" stroke-width="1.5"/>

  <text x="662" y="700" font-size="12" font-weight="bold" fill="#14532d">The extrusion order is unaffected</text>
  <text x="662" y="718" font-size="11.5" fill="#166534">700 → post 500 + boom 150 (50 spare).</text>
  <text x="662" y="735" font-size="11.5" fill="#166534">600 → rail 165 + stub 125 + stub 125 (185 spare).</text>
  <text x="662" y="757" font-size="11.5" font-weight="bold" fill="#15803d">Nothing in the cart needs changing.</text>
</svg>
