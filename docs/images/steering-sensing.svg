<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" width="980" height="800"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>MITT steering angle sensing — load-side absolute encoder (ADR B)</title>

  <defs>
    <pattern id="fixed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9aa4b2" stroke-width="1.6"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowamb" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b45309"/>
    </marker>
    <marker id="dimA" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#b45309"/>
    </marker>
    <marker id="dimB" markerWidth="8" markerHeight="8" refX="1" refY="2.5" orient="auto">
      <path d="M7,0 L7,5 L0,2.5 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="800" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">Steering angle sensing — absolute encoder, mounted LOAD-SIDE</text>
  <text x="24" y="55" font-size="13" fill="#475569">ADR B and ADR §6 (dbw.md). The sensor sits on the road-wheel axis, not on the motor shaft. That choice is the whole point.</text>

  <!-- ============================ 1. TOP VIEW ============================ -->
  <text x="24" y="92" font-size="14" font-weight="bold" fill="#0f172a">1 — Top view of the front axle</text>
  <text x="290" y="92" font-size="12" fill="#64748b">vehicle forward = up</text>

  <rect x="150" y="106" width="700" height="272" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="820" y="126" font-size="11" fill="#94a3b8" text-anchor="end">chassis / front subframe</text>

  <line x1="215" y1="200" x2="765" y2="200" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>

  <!-- LEFT wheel — instrumented -->
  <rect x="188" y="162" width="28" height="78" rx="5" fill="#1e293b"/>
  <circle cx="215" cy="200" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="176" y="262" font-size="11" fill="#334155" text-anchor="middle">front-left</text>
  <path d="M195.1,152 A52,52 0 0,1 234.9,152" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="215" y1="200" x2="215" y2="152" stroke="#0369a1" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="215" y="144" font-size="11.5" font-weight="bold" fill="#0369a1" text-anchor="middle">±22.5°</text>

  <!-- RIGHT wheel -->
  <rect x="764" y="162" width="28" height="78" rx="5" fill="#1e293b"/>
  <circle cx="765" cy="200" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="804" y="262" font-size="11" fill="#334155" text-anchor="middle">front-right</text>

  <!-- linkage -->
  <line x1="215" y1="200" x2="248" y2="266" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <line x1="765" y1="200" x2="732" y2="266" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="266" x2="732" y2="266" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <text x="560" y="286" font-size="11" fill="#475569">tie rod — stock linkage, unmodified</text>

  <!-- gearmotor -->
  <line x1="490" y1="266" x2="490" y2="304" stroke="#475569" stroke-width="5"/>
  <rect x="410" y="304" width="160" height="46" rx="6" fill="#0f172a"/>
  <text x="490" y="325" font-size="12" fill="#ffffff" text-anchor="middle">steering gearmotor</text>
  <text x="490" y="341" font-size="10.5" fill="#94a3b8" text-anchor="middle">Sabertooth M1</text>
  <rect x="578" y="312" width="46" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="601" y="331" font-size="10" fill="#475569" text-anchor="middle">enc</text>
  <text x="634" y="325" font-size="10.5" fill="#64748b">motor-side incremental:</text>
  <text x="634" y="339" font-size="10.5" fill="#64748b">velocity &amp; stall ONLY</text>

  <!-- AS5600 callout -->
  <rect x="170" y="300" width="182" height="56" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="261" y="320" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">AS5600 absolute</text>
  <text x="261" y="336" font-size="11" fill="#92400e" text-anchor="middle">on the kingpin axis</text>
  <text x="261" y="350" font-size="10" fill="#b45309" text-anchor="middle">authoritative for angle</text>
  <line x1="240" y1="300" x2="218" y2="214" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowamb)"/>

  <!-- ==================== 2. THE MOUNT ==================== -->
  <text x="24" y="412" font-size="14" font-weight="bold" fill="#0f172a">2 — How it attaches (section through the kingpin)</text>

  <rect x="150" y="428" width="380" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>

  <rect x="176" y="448" width="140" height="16" fill="url(#fixed)" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="176" y="442" font-size="10.5" fill="#64748b">chassis (fixed)</text>
  <path d="M246,464 L246,496 L306,496" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round"/>
  <text x="176" y="482" font-size="10.5" fill="#64748b">bracket</text>

  <text x="306" y="482" font-size="10.5" fill="#166534">sensor PCB</text>
  <rect x="306" y="488" width="132" height="12" rx="2" fill="#166534"/>
  <rect x="348" y="500" width="46" height="18" rx="2" fill="#0f172a"/>
  <text x="371" y="513" font-size="10" fill="#ffffff" text-anchor="middle">AS5600</text>
  <path d="M438,494 L502,494" fill="none" stroke="#166534" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="512" font-size="10.5" fill="#166534">I²C → Teensy</text>

  <!-- air gap -->
  <line x1="394" y1="518" x2="434" y2="518" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="394" y1="534" x2="434" y2="534" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="430" y1="518" x2="430" y2="534" stroke="#b45309" stroke-width="1.6"
        marker-start="url(#dimB)" marker-end="url(#dimA)"/>
  <text x="440" y="524" font-size="10.5" font-weight="bold" fill="#b45309">air gap</text>
  <text x="440" y="537" font-size="10" fill="#b45309">held to spec</text>

  <!-- magnet -->
  <rect x="336" y="534" width="35" height="24" rx="2" fill="#dc2626"/>
  <rect x="371" y="534" width="35" height="24" rx="2" fill="#1d4ed8"/>
  <text x="353" y="551" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">N</text>
  <text x="389" y="551" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">S</text>
  <text x="326" y="540" font-size="10.5" fill="#334155" text-anchor="end">diametrically magnetised</text>
  <text x="326" y="553" font-size="10.5" fill="#334155" text-anchor="end">magnet, bonded</text>
  <text x="326" y="566" font-size="10.5" fill="#334155" text-anchor="end">concentric to the shaft</text>

  <!-- kingpin -->
  <rect x="358" y="558" width="26" height="112" fill="#94a3b8" stroke="#64748b" stroke-width="1.4"/>
  <text x="180" y="598" font-size="11" fill="#334155">kingpin / steering pivot —</text>
  <text x="180" y="612" font-size="11" fill="#334155">rotates with the ROAD</text>
  <text x="180" y="626" font-size="11" fill="#334155">WHEEL, not the motor</text>
  <line x1="330" y1="612" x2="356" y2="612" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="328" y="670" width="86" height="20" rx="4" fill="#475569"/>
  <text x="371" y="684" font-size="10" fill="#ffffff" text-anchor="middle">knuckle</text>

  <text x="340" y="716" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">total travel ±22.5°</text>
  <text x="340" y="732" font-size="10.5" fill="#0369a1" text-anchor="middle">— never wraps a full turn</text>

  <!-- ==================== 3. WHY LOAD-SIDE ==================== -->
  <text x="560" y="412" font-size="14" font-weight="bold" fill="#0f172a">3 — Why not on the motor shaft?</text>

  <rect x="560" y="428" width="396" height="148" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="578" y="450" font-size="12" font-weight="bold" fill="#991b1b">REJECTED — motor-side mounting (B2)</text>
  <text x="578" y="472" font-size="11.5" fill="#7f1d1d">motor → gearbox → linkage → road wheel</text>
  <text x="578" y="494" font-size="11.5" fill="#7f1d1d">A sensor here measures the <tspan font-style="italic">motor</tspan>, so gearbox</text>
  <text x="578" y="510" font-size="11.5" fill="#7f1d1d">backlash and coupling slip become invisible bias:</text>
  <text x="578" y="526" font-size="11.5" fill="#7f1d1d">the wheels are not where the sensor says.</text>
  <text x="578" y="548" font-size="11.5" fill="#7f1d1d">It also needs homing every boot, and loses its</text>
  <text x="578" y="564" font-size="11.5" fill="#7f1d1d">reference on any linkage slip or power glitch.</text>

  <rect x="560" y="590" width="396" height="154" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
  <text x="578" y="612" font-size="12" font-weight="bold" fill="#166534">ADOPTED — load-side mounting</text>
  <text x="578" y="634" font-size="11.5" fill="#14532d">Downstream of every mechanical error source, so</text>
  <text x="578" y="650" font-size="11.5" fill="#14532d">backlash and slip appear as <tspan font-weight="bold">measured error</tspan>,</text>
  <text x="578" y="666" font-size="11.5" fill="#14532d">not as hidden bias.</text>
  <text x="578" y="688" font-size="11.5" fill="#14532d">Absolute from power-on — no homing dance, and</text>
  <text x="578" y="704" font-size="11.5" fill="#14532d">it survives linkage slip.</text>
  <text x="578" y="726" font-size="11.5" fill="#14532d">Travel is ±22.5°, well inside one turn, so the</text>
  <text x="578" y="742" font-size="11.5" fill="#14532d">single-turn wrap hazard cannot occur.</text>

  <text x="24" y="774" font-size="11" fill="#64748b">GATE, before ordering: measure lock-to-lock travel of the chosen shaft. If it exceeds ~340°, the magnetic encoder wraps and silently loses absolute</text>
  <text x="24" y="790" font-size="11" fill="#64748b">meaning — fall back to the single-turn potentiometer. Nothing here is measured yet; every dimension in this drawing is estimated.</text>
</svg>
