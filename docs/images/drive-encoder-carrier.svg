<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title>Carrier and magnet track - drawn from the printed part</title>
<desc>Left: end view looking along the axle. A one-piece printed ring on the six-lobe hub, carrying eighteen magnets in alternating polarity, with three recessed grub screws 120 degrees apart dropped into lobe gaps. The two Hall latches sit radially outside the track, HALF a magnet pitch apart, so when A is over a magnet B is over the boundary between two - the angles are computed from the CAD model rather than placed by hand. Right: axial section, with each magnet drawn magnetised radially, poles stacked through the ring wall and the outward face alternating north and south as the carrier turns.</desc>
<rect x="0.0" y="0.0" width="980.0" height="760.0" rx="0" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">Carrier and magnet track — one piece, nothing standing proud</text>
<text x="24.0" y="56.0" font-size="12" font-weight="normal" fill="#64748b" text-anchor="start">Every dimension here is read from cad/drive_encoder_carrier.scad, the model that was printed and checked.</text>
