  <g stroke="#15803d" stroke-width="2.5" fill="#bbf7d0">
    <rect x="236.3" y="212" width="14" height="19" rx="2"/>
    <rect x="259.7" y="212" width="14" height="19" rx="2"/>
  </g>
  <text x="243" y="226" font-size="9" font-weight="bold" fill="#14532d" text-anchor="middle">A</text>
  <text x="267" y="226" font-size="9" font-weight="bold" fill="#14532d" text-anchor="middle">B</text>
  <path d="M243,232 L243,243" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="208" font-size="11" font-weight="bold" fill="#b91c1c">air gap ~2 mm</text>
  <line x1="243" y1="196" x2="267" y2="196" stroke="#15803d" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="255" y="188" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">6.8 mm</text>
  <text x="255" y="174" font-size="10.5" fill="#15803d" text-anchor="middle">= HALF a magnet pitch</text>

  <text x="372" y="244" font-size="11.5" font-weight="bold" fill="#b45309">printed carrier</text>
  <text x="372" y="258" font-size="10.5" fill="#92400e">splined bore, Ø63.5</text>
  <text x="372" y="272" font-size="10.5" fill="#92400e">plain OD, Ø69.5</text>
  <line x1="368" y1="264" x2="330" y2="265" stroke="#b45309" stroke-width="1.2"/>

  <text x="56" y="458" font-size="11.5" font-weight="bold" fill="#1e3a8a">16 magnets, alternating</text>
  <text x="56" y="473" font-size="10.5" fill="#2563eb">pitch 13.6 mm · 32 counts/rev</text>
  <line x1="120" y1="452" x2="180" y2="415" stroke="#2563eb" stroke-width="1.2"/>

  <text x="44" y="632" font-size="12.5" fill="#334155">One electrical cycle spans <tspan font-weight="bold">two</tspan> magnets, so 90° electrical is</text>
  <text x="44" y="650" font-size="12.5" fill="#334155"><tspan font-weight="bold">half</tspan> a pitch — not a quarter, which this page had wrong.</text>

  <rect x="532" y="76" width="424" height="600" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="552" y="102" font-size="15" font-weight="bold" fill="#14532d">AXIAL SECTION — where the 8 mm goes</text>

  <line x1="560" y1="470" x2="930" y2="470" stroke="#64748b" stroke-width="1.5" stroke-dasharray="9 5"/>
  <text x="860" y="464" font-size="10.5" fill="#64748b">centreline</text>

  <rect x="570" y="330" width="78" height="140" fill="url(#h)" stroke="#475569" stroke-width="2"/>
  <rect x="570" y="330" width="78" height="140" fill="#e2e8f0" fill-opacity="0.5"/>
  <text x="574" y="492" font-size="11" font-weight="bold" fill="#334155">gearbox</text>
  <text x="580" y="506" font-size="10.5" fill="#64748b">FIXED</text>
  <circle cx="608" cy="348" r="5" fill="#fff" stroke="#475569" stroke-width="2"/>

  <rect x="660" y="372" width="96" height="98" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="668" y="492" font-size="11" font-weight="bold" fill="#1e3a8a">hub · ROTATES</text>

  <rect x="668" y="352" width="80" height="20" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="762" y="348" font-size="11" font-weight="bold" fill="#b45309">carrier</text>
  <rect x="672" y="338" width="72" height="14" fill="#1e3a8a"/>
  <g font-size="8.5" fill="#fff" text-anchor="middle">
    <text x="682" y="348">N</text><text x="700" y="348">S</text><text x="718" y="348">N</text><text x="736" y="348">S</text></g>
  <text x="762" y="333" font-size="11" font-weight="bold" fill="#1e3a8a">magnets</text>

  <rect x="768" y="300" width="30" height="170" rx="5" fill="#f1f5f900" stroke="#94a3b8" stroke-width="2"/>
  <text x="804" y="392" font-size="11" fill="#64748b">wheel</text>

  <path d="M608,340 L608,262 L700,262 L700,312" fill="none" stroke="#15803d" stroke-width="5" stroke-linejoin="round"/>
  <rect x="684" y="312" width="32" height="16" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="726" y="276" font-size="11" font-weight="bold" fill="#15803d">bracket + sensors</text>
  <text x="726" y="291" font-size="10.5" fill="#15803d">both A and B in one part</text>

  <line x1="660" y1="534" x2="768" y2="534" stroke="#b91c1c" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="714" y="554" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">8 mm — gearbox to wheel</text>
  <line x1="660" y1="478" x2="660" y2="540" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="768" y1="478" x2="768" y2="540" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="552" y="596" font-size="12.5" fill="#14532d">The sensors sit <tspan font-weight="bold">radially outside</tspan> the magnets, not beside</text>
  <text x="552" y="614" font-size="12.5" fill="#14532d">them — so the 8 mm holds the track width and the sensor's</text>
  <text x="552" y="632" font-size="12.5" fill="#14532d">thickness <tspan font-weight="bold">side by side</tspan>, not stacked. Both fit comfortably.</text>
  <text x="552" y="656" font-size="12" fill="#15803d" font-style="italic">An earlier revision stacked them and found 1 mm. Wrong picture.</text>
</svg>
