<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Drive encoder carrier and magnet track — end view and axial section</title>
  <desc>Left: looking along the axle. A printed sleeve grips the splined hub and presents a plain
  cylinder carrying sixteen magnets in alternating polarity; two Hall sensors sit outside it, half a
  magnet pitch apart. Right: the same assembly in axial section, showing that the sensors sit
  radially outside the magnets rather than beside them, and that the 8 mm gap between the gearbox
  and the wheel is what everything fits inside.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#334155"/></marker>
    <pattern id="h" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#94a3b8" stroke-width="2.5"/></pattern>
  </defs>
  <rect width="980" height="700" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">Carrier and magnet track — what actually gets built</text>
  <text x="24" y="56" font-size="13" fill="#475569">Hub measured 63.5 mm across the spline crests. Left: end view, looking along the axle. Right: axial section.</text>

  <rect x="24" y="76" width="492" height="600" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="44" y="102" font-size="15" font-weight="bold" fill="#0f172a">END VIEW — looking along the axle</text>

  <circle cx="255" cy="340" r="104" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="255" cy="340" r="95" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
