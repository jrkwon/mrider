<text x="299.3" y="214.2" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">6.81 mm</text>
<text x="299.3" y="200.2" font-size="10.5" font-weight="normal" fill="#15803d" text-anchor="middle">= HALF a magnet pitch</text>
<text x="299.3" y="186.2" font-size="10" font-weight="normal" fill="#15803d" text-anchor="middle">A on a magnet → B on a BOUNDARY</text>
<text x="44.0" y="150.0" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="start">6 broad lobes, narrow gaps</text>
<text x="44.0" y="164.0" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="start">— the hub's feature, not the</text>
<text x="44.0" y="178.0" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="start">carrier's. Bore is round.</text>
<text x="44.0" y="560.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">18 magnets, alternating</text>
<text x="44.0" y="576.0" font-size="10.5" font-weight="normal" fill="#2563eb" text-anchor="start">pitch 13.62 mm · 36 counts/rev</text>
<text x="290.0" y="606.0" font-size="11.5" font-weight="bold" fill="#b91c1c" text-anchor="start">3 × M3 grub screw</text>
<text x="290.0" y="622.0" font-size="10.5" font-weight="normal" fill="#b91c1c" text-anchor="start">recessed below the OD Ø78.02</text>
<text x="290.0" y="638.0" font-size="10.5" font-weight="normal" fill="#b91c1c" text-anchor="start">first one 10° off magnet 0,</text>
<text x="290.0" y="654.0" font-size="10.5" font-weight="normal" fill="#b91c1c" text-anchor="start">so all three land in lobe gaps</text>
<rect x="44.0" y="668.0" width="452.0" height="52.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="56.0" y="690.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Every feature here is a RECESS.</text>
<text x="56.0" y="708.0" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">Nothing stands proud of Ø78.02.</text>
