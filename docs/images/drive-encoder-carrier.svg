  <g transform="translate(351.3,300.1) rotate(67.5)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S</text></g>
  <g transform="translate(359.2,340.0) rotate(90.0)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text></g>
