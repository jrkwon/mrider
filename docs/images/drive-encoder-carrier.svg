  <text x="262" y="204" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">7.07 mm</text>
  <text x="262" y="190" font-size="10.5" fill="#15803d" text-anchor="middle">= HALF a magnet pitch</text>
  <text x="382" y="250" font-size="11.5" font-weight="bold" fill="#b45309">one-piece ring</text>
  <text x="382" y="264" font-size="10.5" fill="#92400e">bore Ø67.0 (clearance)</text>
  <text x="382" y="278" font-size="10.5" fill="#92400e">plain OD Ø81.0</text>
  <line x1="378" y1="270" x2="346" y2="282" stroke="#b45309" stroke-width="1.2"/>
  <text x="44" y="474" font-size="11.5" font-weight="bold" fill="#1e3a8a">18 magnets, alternating</text>
  <text x="44" y="489" font-size="10.5" fill="#2563eb">pitch 14.14 mm · 36 counts/rev</text>
  <line x1="140" y1="468" x2="186" y2="432" stroke="#2563eb" stroke-width="1.2"/>
  <text x="300" y="492" font-size="11.5" font-weight="bold" fill="#7f1d1d">3 × M3 grub screw</text>
  <text x="300" y="507" font-size="10.5" fill="#b91c1c">recessed below the OD,</text>
  <text x="300" y="521" font-size="10.5" fill="#b91c1c">into spline valleys</text>
  <line x1="332" y1="484" x2="316" y2="452" stroke="#b91c1c" stroke-width="1.2"/>
  <line x1="394" y1="348" x2="364" y2="346" stroke="#334155" stroke-width="1.2"/>
  <text x="398" y="352" font-size="10.5" font-weight="bold" fill="#0f172a">index groove</text>
  <text x="398" y="366" font-size="10.5" fill="#334155">in one face only</text>
  <rect x="40" y="546" width="460" height="52" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="56" y="568" font-size="12.5" font-weight="bold" fill="#7f1d1d">Every feature here is a RECESS. Nothing stands proud of Ø81.0.</text>
  <text x="56" y="587" font-size="12" fill="#7f1d1d">A two-piece version put clamp ears 9 mm out — they swept the sensor.</text>
  <text x="44" y="628" font-size="12.5" fill="#334155">One electrical cycle spans <tspan font-weight="bold">two</tspan> magnets, so 90° electrical is</text>
  <text x="44" y="646" font-size="12.5" fill="#334155"><tspan font-weight="bold">half</tspan> a pitch — not a quarter, which this page once had wrong.</text>
  <rect x="532" y="76" width="424" height="600" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
