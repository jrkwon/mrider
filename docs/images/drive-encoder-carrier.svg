  <line x1="352.4" y1="346.0" x2="363.2" y2="346.0" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 3"/>
  <g transform="translate(241.4,229.0) rotate(-100.0)"><rect x="-6" y="-9" width="12" height="18" rx="2" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/></g><text x="241.4" y="233.0" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">A</text>
  <g transform="translate(282.6,229.0) rotate(-80.0)"><rect x="-6" y="-9" width="12" height="18" rx="2" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/></g><text x="282.6" y="233.0" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">B</text>
  <line x1="239.3" y1="217.2" x2="284.7" y2="217.2" stroke="#15803d" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="262" y="199" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">7.07 mm</text>
  <text x="262" y="185" font-size="10.5" fill="#15803d" text-anchor="middle">= HALF a magnet pitch</text>
  <line x1="382" y1="272" x2="352" y2="284" stroke="#b45309" stroke-width="1.2"/>
  <text x="386" y="252" font-size="11.5" font-weight="bold" fill="#b45309">one-piece ring</text>
  <text x="386" y="266" font-size="10.5" fill="#92400e">bore Ø67.0 (clearance)</text>
  <text x="386" y="280" font-size="10.5" fill="#92400e">plain OD Ø81.0</text>
  <line x1="398" y1="348" x2="368" y2="346" stroke="#334155" stroke-width="1.2"/>
  <text x="402" y="352" font-size="10.5" font-weight="bold" fill="#0f172a">index groove</text>
  <text x="402" y="366" font-size="10.5" fill="#334155">in one face only</text>
  <text x="44" y="474" font-size="11.5" font-weight="bold" fill="#1e3a8a">18 magnets, alternating</text>
  <text x="44" y="489" font-size="10.5" fill="#2563eb">pitch 14.14 mm · 36 counts/rev</text>
  <line x1="146" y1="468" x2="190" y2="436" stroke="#2563eb" stroke-width="1.2"/>
  <text x="300" y="492" font-size="11.5" font-weight="bold" fill="#7f1d1d">3 × M3 grub screw</text>
  <text x="300" y="507" font-size="10.5" fill="#b91c1c">recessed below the OD,</text>
  <text x="300" y="521" font-size="10.5" fill="#b91c1c">dropped into lobe gaps</text>
  <line x1="330" y1="484" x2="314" y2="456" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="44" y="136" font-size="11" font-weight="bold" fill="#334155">SIX broad lobes, narrow gaps</text>
  <text x="44" y="151" font-size="10.5" fill="#64748b">— not a fine spline, which is why a wire</text>
  <text x="44" y="165" font-size="10.5" fill="#64748b">round the crests reads Ø to within 0.1 mm</text>
  <line x1="112" y1="172" x2="176" y2="292" stroke="#64748b" stroke-width="1.2"/>
  <rect x="40" y="540" width="460" height="56" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="56" y="562" font-size="12.5" font-weight="bold" fill="#7f1d1d">Every feature here is a RECESS. Nothing stands proud of Ø81.0.</text>
  <text x="56" y="581" font-size="12" fill="#7f1d1d">A two-piece version put clamp ears 9 mm out — they swept the sensor.</text>
  <rect x="40" y="606" width="460" height="56" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="56" y="628" font-size="12.5" font-weight="bold" fill="#92400e">6 lobes at 60° · 3 screws at 120° = exactly two lobe pitches.</text>
  <text x="56" y="647" font-size="12" fill="#78350f">So all three land together. Turn the ring one lobe to seat them in gaps.</text>
  <rect x="532" y="76" width="424" height="600" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="552" y="102" font-size="15" font-weight="bold" fill="#14532d">AXIAL SECTION — where the 8 mm goes</text>
  <line x1="560" y1="470" x2="930" y2="470" stroke="#64748b" stroke-width="1.5" stroke-dasharray="9 5"/>
  <text x="860" y="464" font-size="10.5" fill="#64748b">centreline</text>
  <rect x="570" y="330" width="78" height="140" fill="url(#h)" stroke="#475569" stroke-width="2"/>
  <rect x="570" y="330" width="78" height="140" fill="#e2e8f0" fill-opacity="0.5"/>
  <text x="574" y="492" font-size="11" font-weight="bold" fill="#334155">gearbox</text>
  <text x="580" y="506" font-size="10.5" fill="#64748b">FIXED</text>
  <circle cx="608" cy="348" r="5" fill="#fff" stroke="#475569" stroke-width="2"/>
  <rect x="660" y="372" width="96" height="98" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="664" y="492" font-size="11" font-weight="bold" fill="#1e3a8a">lobed boss · ROTATES</text>
  <rect x="668" y="344" width="80" height="28" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect x="672" y="336" width="72" height="10" fill="#1e3a8a"/>
  <g font-size="8" fill="#fff" text-anchor="middle"><text x="682" y="344">N</text><text x="700" y="344">S</text><text x="718" y="344">N</text><text x="736" y="344">S</text></g>
  <line x1="700" y1="346" x2="700" y2="380" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <rect x="768" y="300" width="30" height="170" rx="5" fill="#f1f5f900" stroke="#94a3b8" stroke-width="2"/>
  <text x="804" y="392" font-size="11" fill="#64748b">wheel</text>
  <line x1="782" y1="182" x2="746" y2="339" stroke="#2563eb" stroke-width="1.2"/>
  <text x="786" y="176" font-size="11" font-weight="bold" fill="#1e3a8a">magnets</text>
  <text x="786" y="190" font-size="10" fill="#2563eb">18, alternating</text>
  <line x1="782" y1="220" x2="750" y2="352" stroke="#b45309" stroke-width="1.2"/>
  <text x="786" y="214" font-size="11" font-weight="bold" fill="#b45309">carrier — one piece</text>
  <text x="786" y="228" font-size="10" fill="#92400e">no split, no ears</text>
  <line x1="782" y1="318" x2="706" y2="362" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="786" y="312" font-size="11" font-weight="bold" fill="#7f1d1d">grub screw</text>
  <text x="786" y="326" font-size="10" fill="#b91c1c">flush, then into</text>
  <text x="786" y="340" font-size="10" fill="#b91c1c">a lobe gap</text>
  <text x="804" y="406" font-size="10" fill="#94a3b8">comes off</text>
  <path d="M608,340 L608,262 L700,262 L700,310" fill="none" stroke="#15803d" stroke-width="5" stroke-linejoin="round"/>
  <rect x="684" y="310" width="32" height="16" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="726" y="276" font-size="11" font-weight="bold" fill="#15803d">bracket + sensors</text>
  <text x="726" y="291" font-size="10.5" fill="#15803d">both A and B in one part</text>
  <line x1="660" y1="534" x2="768" y2="534" stroke="#b91c1c" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="714" y="554" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">8 mm — gearbox to wheel</text>
  <line x1="660" y1="478" x2="660" y2="540" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="768" y1="478" x2="768" y2="540" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="552" y="592" font-size="12.5" fill="#14532d">The sensors sit <tspan font-weight="bold">radially outside</tspan> the magnets, not beside</text>
  <text x="552" y="610" font-size="12.5" fill="#14532d">them — so the 8 mm holds the track width and the sensor&#39;s</text>
  <text x="552" y="628" font-size="12.5" fill="#14532d">thickness <tspan font-weight="bold">side by side</tspan>, not stacked. Both fit comfortably.</text>
  <text x="552" y="652" font-size="12" fill="#15803d" font-style="italic">Radial room: not measured. The fit mule either spins or it does not.</text>
</svg>
