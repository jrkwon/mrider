  <g transform="translate(328.7,413.7) rotate(135.0)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text></g>
  <g transform="translate(294.9,436.3) rotate(157.5)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S</text></g>
  <g transform="translate(255.0,444.2) rotate(180.0)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text></g>
  <g transform="translate(215.1,436.3) rotate(202.5)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S</text></g>
  <g transform="translate(181.3,413.7) rotate(225.0)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text></g>
  <g transform="translate(158.7,379.9) rotate(247.5)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S</text></g>
  <g transform="translate(150.8,340.0) rotate(270.0)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text></g>
