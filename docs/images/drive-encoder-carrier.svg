<text x="726.0" y="300.0" font-size="11" font-weight="bold" fill="#15803d" text-anchor="start">bracket + sensors</text>
<text x="726.0" y="315.0" font-size="10.5" font-weight="normal" fill="#15803d" text-anchor="start">both A and B in one part</text>
<rect x="768.0" y="300.0" width="30.0" height="170.0" rx="5" fill="none" stroke="#94a3b8" stroke-width="2"/>
<text x="804.0" y="392.0" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">wheel</text>
<text x="786.0" y="176.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">magnets</text>
<text x="786.0" y="190.0" font-size="10" font-weight="normal" fill="#2563eb" text-anchor="start">18, alternating</text>
<text x="786.0" y="214.0" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">carrier — one piece</text>
<text x="786.0" y="228.0" font-size="10" font-weight="normal" fill="#92400e" text-anchor="start">wall 7 mm, width 6 mm</text>
<line x1="660" y1="534" x2="768" y2="534" stroke="#b91c1c" stroke-width="2"/>
<text x="714.0" y="554.0" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">8 mm — gearbox to wheel</text>
<text x="552.0" y="592.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">The sensors sit radially OUTSIDE the magnets, not beside</text>
<text x="552.0" y="610.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">them — so the 8 mm holds the track width and the</text>
<text x="552.0" y="628.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">sensor's thickness side by side, not stacked.</text>
<text x="552.0" y="664.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">Each magnet is magnetised RADIALLY — its poles stack</text>
<text x="552.0" y="682.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">through the ring wall, they do not run along it. What the</text>
<text x="552.0" y="700.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">sensor reads is the OUTWARD face, and THAT is what</text>
<text x="552.0" y="718.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">alternates N, S, N, S.</text>
