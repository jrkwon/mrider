="1"/>
  <circle cx="255" cy="340" r="26" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="255" y="344" font-size="10.5" fill="#475569" text-anchor="middle">axle</text>
  <g transform="translate(255.0,235.8) rotate(0.0)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text></g>
  <g transform="translate(294.9,243.7) rotate(22.5)"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><text x="0" y="4" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S</text></g>
