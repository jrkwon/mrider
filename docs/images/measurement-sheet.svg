<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1814" width="1240" height="1814"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>MRider measurement sheet — everything still blocking a cut, a print or a solder joint</title>
  <desc>A single printable page listing every outstanding measurement on the MRider build, grouped
  by where it is taken: deck and lid, drive encoder, steering, sensors, electronics, and electrical
  checks. Each row gives the quantity, a blank to write in, and one line on what it unblocks.</desc>

  <defs>
    <pattern id="rule" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff"/>
    </pattern>
  </defs>

  <rect width="1240" height="1814" fill="#ffffff"/>

  <rect x="0" y="0" width="1240" height="92" fill="#0f172a"/>
  <text x="40" y="46" font-size="26" font-weight="bold" fill="#ffffff">MRider — measurement sheet</text>
  <text x="40" y="74" font-size="14" fill="#cbd5e1">Every number still blocking a cut, a print or a solder joint.  Date ______________   By ______________</text>
  <text x="1200" y="74" font-size="13" fill="#94a3b8" text-anchor="end">one sheet per vehicle · record the vehicle: ____</text>

  <!-- ===== 1 DECK & LID ===== -->
  <rect x="24" y="112" width="1192" height="34" fill="#fde68a"/>
  <text x="40" y="136" font-size="16" font-weight="bold" fill="#78350f">1 · DECK AND LID — blocks the plywood cut and the pillar prints</text>

  <g font-size="13" fill="#0f172a">
    <text x="40" y="172" font-weight="bold">D2</text><text x="110" y="172">Seat screw thread — the two at (10,&#8201;25) and (310,&#8201;25)</text>
    <line x1="700" y1="176" x2="880" y2="176" stroke="#94a3b8"/>
    <text x="900" y="172" font-size="11" fill="#64748b">moulded plastic, confirmed 2026-10-19 &#8212; size never read</text>

    <text x="40" y="202" font-weight="bold">D3</text><text x="110" y="202">Lid opening rim to rim, EXCLUDING the curved raised ends</text>
    <line x1="700" y1="206" x2="810" y2="206" stroke="#94a3b8"/>
    <text x="816" y="202">&#215;</text>
    <line x1="828" y1="206" x2="880" y2="206" stroke="#94a3b8"/>
    <text x="900" y="202" font-size="11" fill="#64748b">320&#215;215 is DERIVED &#8212; oversize cannot be sanded out</text>

    <text x="40" y="232" font-weight="bold">D11a</text><text x="110" y="232">Spare battery-fixing holes — thread size</text>
    <line x1="700" y1="236" x2="880" y2="236" stroke="#94a3b8"/>
    <text x="900" y="232" font-size="11" fill="#64748b">sizes the pillar screws</text>

    <text x="40" y="262" font-weight="bold">D11b</text><text x="110" y="262">The rectangle they form — fore-aft × lateral</text>
    <line x1="700" y1="266" x2="880" y2="266" stroke="#94a3b8"/>
    <text x="900" y="262" font-size="11" fill="#64748b">×</text>
    <line x1="915" y1="266" x2="1040" y2="266" stroke="#94a3b8"/>

    <text x="40" y="292" font-weight="bold">D11c</text><text x="110" y="292"><tspan font-weight="bold">x offset from the lid centreline</tspan> — are they beside the rail?</text>
    <line x1="700" y1="296" x2="880" y2="296" stroke="#94a3b8"/>
    <text x="900" y="292" font-size="11" fill="#b91c1c">if under the rail, no bolt reaches them</text>

    <text x="40" y="322" font-weight="bold">D12</text><text x="110" y="322">Rim plane → each boss face, <tspan font-weight="bold">all four</tspan> (pillar heights)</text>
    <line x1="700" y1="326" x2="760" y2="326" stroke="#94a3b8"/>
    <line x1="775" y1="326" x2="835" y2="326" stroke="#94a3b8"/>
    <line x1="850" y1="326" x2="910" y2="326" stroke="#94a3b8"/>
    <line x1="925" y1="326" x2="985" y2="326" stroke="#94a3b8"/>
    <text x="1000" y="322" font-size="11" fill="#64748b">they need not be equal</text>

    <text x="40" y="352" font-weight="bold">D13</text><text x="110" y="352">Does the battery still lift out with pillars fitted?  Y / N</text>
    <line x1="700" y1="356" x2="880" y2="356" stroke="#94a3b8"/>
    <text x="900" y="352" font-size="11" fill="#b91c1c">a pillar in the way trades one problem for a worse one</text>

    <text x="40" y="382" font-weight="bold">D4</text><text x="110" y="382">Footwell floor under the mat — L × W, and is it flat?</text>
    <line x1="700" y1="386" x2="880" y2="386" stroke="#94a3b8"/>
    <text x="900" y="382" font-size="11" fill="#64748b">×</text>
    <line x1="915" y1="386" x2="1040" y2="386" stroke="#94a3b8"/>

    <text x="40" y="412" font-weight="bold">D6</text><text x="110" y="412">Footwell floor → bay rim (step height)</text>
    <line x1="700" y1="416" x2="880" y2="416" stroke="#94a3b8"/>

    <text x="40" y="442" font-weight="bold">D7</text><text x="110" y="442">Footwell floor → top of the side walls</text>
    <line x1="700" y1="446" x2="880" y2="446" stroke="#94a3b8"/>
    <text x="900" y="442" font-size="11" fill="#64748b">caps the power-box height</text>

    <text x="40" y="472" font-weight="bold">D5</text><text x="110" y="472">Harness anchors — thread, and metal or moulded boss?</text>
    <line x1="700" y1="476" x2="880" y2="476" stroke="#94a3b8"/>
    <text x="900" y="472" font-size="11" fill="#64748b">the only pull-out-rated points in the cockpit</text>

    <text x="40" y="502" font-weight="bold">CC</text><text x="110" y="502">Controller cover — footprint, and position from a lid corner</text>
    <line x1="700" y1="506" x2="880" y2="506" stroke="#94a3b8"/>
    <text x="900" y="502" font-size="11" fill="#b91c1c">blocks the vent cut</text>
  </g>

  <!-- ===== 2 DRIVE ENCODER ===== -->
  <rect x="24" y="530" width="1192" height="34" fill="#bbf7d0"/>
  <text x="40" y="554" font-size="16" font-weight="bold" fill="#14532d">2 · DRIVE ENCODER — blocks the sensor bracket and the carrier's acceptance</text>

  <g font-size="13" fill="#0f172a">
    <text x="40" y="590" font-weight="bold">N1</text><text x="110" y="590"><tspan font-weight="bold">Gearbox housing nose — diameter</tspan></text>
    <line x1="700" y1="594" x2="880" y2="594" stroke="#94a3b8"/>
    <text x="900" y="590" font-size="11" fill="#b91c1c">the bracket clamps this — nothing can be drawn without it</text>

    <text x="40" y="620" font-weight="bold">N2</text><text x="110" y="620">Housing nose — length still bare with the wheel fitted</text>
    <line x1="700" y1="624" x2="880" y2="624" stroke="#94a3b8"/>

    <text x="40" y="650" font-weight="bold">H1</text><text x="110" y="650">Hub <tspan font-weight="bold">valley</tspan> diameter — caliper across two opposite valleys</text>
    <line x1="700" y1="654" x2="880" y2="654" stroke="#94a3b8"/>
    <text x="900" y="650" font-size="11" fill="#64748b">lobe depth = (62.7 − this) ÷ 2</text>

    <text x="40" y="680" font-weight="bold">R1</text><text x="110" y="680">Radial room in the 8 mm slice — needs ≥ 45.95 mm</text>
    <line x1="700" y1="684" x2="880" y2="684" stroke="#94a3b8"/>
    <text x="900" y="680" font-size="11" fill="#64748b">settled by fitting the gauge and turning the wheel</text>

    <text x="40" y="710" font-weight="bold">I1</text><text x="110" y="710">Paralleled drive-motor stall current</text>
    <line x1="700" y1="714" x2="880" y2="714" stroke="#94a3b8"/>
    <text x="900" y="710" font-size="11" fill="#64748b">A — against the 30 A channel and the 20 A limit</text>
  </g>

  <!-- ===== 3 STEERING ===== -->
  <rect x="24" y="738" width="1192" height="34" fill="#dbeafe"/>
  <text x="40" y="762" font-size="16" font-weight="bold" fill="#1e3a8a">3 · STEERING — blocks the magnet cap print</text>

  <g font-size="13" fill="#0f172a">
    <text x="40" y="798" font-weight="bold">S1</text><text x="110" y="798"><tspan font-weight="bold">STACK_H</tspan> — the KINGPIN BOLT stack: washer's top face to the top of all of it</text>
    <line x1="700" y1="802" x2="880" y2="802" stroke="#94a3b8"/>
    <text x="900" y="798" font-size="11" fill="#b91c1c">not the magnet, and not the 10 mm pass over the washer</text>

    <text x="40" y="828" font-weight="bold">S2</text><text x="110" y="828"><tspan font-weight="bold">HEAD_H</tspan> — height of the hex alone</text>
    <line x1="700" y1="832" x2="880" y2="832" stroke="#94a3b8"/>
    <text x="900" y="828" font-size="11" fill="#64748b">must be ≥ 4 mm or the cap rocks</text>

    <text x="40" y="858" font-weight="bold">V2</text><text x="110" y="858">Road-wheel lock-to-lock, with a protractor</text>
    <line x1="700" y1="862" x2="880" y2="862" stroke="#94a3b8"/>
    <text x="900" y="858" font-size="11" fill="#64748b">° — photo-derived was 50–60° and read high three times</text>
  </g>

  <!-- ===== 4 SENSORS ===== -->
  <rect x="24" y="886" width="1192" height="34" fill="#ede9fe"/>
  <text x="40" y="910" font-size="16" font-weight="bold" fill="#4c1d95">4 · SENSOR BODIES — both already in hand, blocks the printed mounts</text>

  <g font-size="13" fill="#0f172a">
    <text x="40" y="946" font-weight="bold">L1</text><text x="110" y="946">RPLIDAR base — bolt count, thread, spacing</text>
    <line x1="700" y1="950" x2="880" y2="950" stroke="#94a3b8"/>

    <text x="40" y="976" font-weight="bold">L2</text><text x="110" y="976">RPLIDAR — <tspan font-weight="bold">scan-plane height above its base</tspan></text>
    <line x1="700" y1="980" x2="880" y2="980" stroke="#94a3b8"/>
    <text x="900" y="976" font-size="11" fill="#64748b">sets the occlusion sector, not just the packaging</text>

    <text x="40" y="1006" font-weight="bold">L3</text><text x="110" y="1006">RPLIDAR — cable exit direction + clearance needed</text>
    <line x1="700" y1="1010" x2="880" y2="1010" stroke="#94a3b8"/>

    <text x="40" y="1036" font-weight="bold">C1</text><text x="110" y="1036">Camera case — L × W × H</text>
    <line x1="700" y1="1040" x2="880" y2="1040" stroke="#94a3b8"/>

    <text x="40" y="1066" font-weight="bold">C2</text><text x="110" y="1066">Camera — 1/4"-20 tripod thread?  Y / N</text>
    <line x1="700" y1="1070" x2="880" y2="1070" stroke="#94a3b8"/>

    <text x="40" y="1096" font-weight="bold">C3</text><text x="110" y="1096">Camera — optical-axis height above the case bottom</text>
    <line x1="700" y1="1100" x2="880" y2="1100" stroke="#94a3b8"/>
  </g>

  <!-- ===== 5 ELECTRONICS ===== -->
  <rect x="24" y="1124" width="1192" height="34" fill="#fecaca"/>
  <text x="40" y="1148" font-size="16" font-weight="bold" fill="#7f1d1d">5 · ENCLOSURE CONTENTS — blocks the two printed boxes</text>

  <g font-size="13" fill="#0f172a">
    <text x="40" y="1184" font-weight="bold">E1</text><text x="110" y="1184">LiFePO₄ pack — L × W × H, and mass</text>
    <line x1="700" y1="1188" x2="1040" y2="1188" stroke="#94a3b8"/>

    <text x="40" y="1214" font-weight="bold">E2</text><text x="110" y="1214">Teensy 4.1 <tspan font-weight="bold">with headers fitted</tspan> — L × W × H</text>
    <line x1="700" y1="1218" x2="1040" y2="1218" stroke="#94a3b8"/>

    <text x="40" y="1244" font-weight="bold">E3</text><text x="110" y="1244">Pololu #2806 — L × W × H</text>
    <line x1="700" y1="1248" x2="1040" y2="1248" stroke="#94a3b8"/>

    <text x="40" y="1274" font-weight="bold">E4</text><text x="110" y="1274">UBEC — L × W × H</text>
    <line x1="700" y1="1278" x2="1040" y2="1278" stroke="#94a3b8"/>

    <text x="40" y="1304" font-weight="bold">E5</text><text x="110" y="1304">Relay MUX assembly — footprint <tspan font-style="italic">as built, with sockets</tspan></text>
    <line x1="700" y1="1308" x2="1040" y2="1308" stroke="#94a3b8"/>

    <text x="40" y="1334" font-weight="bold">E6</text><text x="110" y="1334">E-stop button — panel cut-out Ø and depth behind</text>
    <line x1="700" y1="1338" x2="1040" y2="1338" stroke="#94a3b8"/>

    <text x="40" y="1364" font-weight="bold">E7</text><text x="110" y="1364">Contactor — L × W × H with bracket</text>
    <line x1="700" y1="1368" x2="1040" y2="1368" stroke="#94a3b8"/>

    <text x="40" y="1394" font-weight="bold">E8</text><text x="110" y="1394"><tspan font-weight="bold">Total added mass, and the height of each item</tspan></text>
    <line x1="700" y1="1398" x2="1040" y2="1398" stroke="#94a3b8"/>
    <text x="40" y="1416" font-size="11" fill="#64748b">feeds the tip-over check, which has only ever used an estimated 6 kg at an estimated height</text>
  </g>

  <!-- ===== 6 ELECTRICAL ===== -->
  <rect x="24" y="1438" width="1192" height="34" fill="#cffafe"/>
  <text x="40" y="1462" font-size="16" font-weight="bold" fill="#155e75">6 · ELECTRICAL CHECKS — ten minutes each, and two are gates</text>

  <g font-size="13" fill="#0f172a">
    <text x="40" y="1498" font-weight="bold">X1</text><text x="110" y="1498"><tspan font-weight="bold">i-BUS idle level at the receiver</tspan> — 3.3 V or 5 V?</text>
    <line x1="700" y1="1502" x2="880" y2="1502" stroke="#94a3b8"/>
    <text x="900" y="1498" font-size="11" fill="#b91c1c">the Teensy 4.1 is NOT 5 V tolerant</text>

    <text x="40" y="1528" font-weight="bold">X2</text><text x="110" y="1528">The other five UBEC outputs (one read 5.11 V)</text>
    <line x1="700" y1="1532" x2="760" y2="1532" stroke="#94a3b8"/>
    <line x1="775" y1="1532" x2="835" y2="1532" stroke="#94a3b8"/>
    <line x1="850" y1="1532" x2="910" y2="1532" stroke="#94a3b8"/>
    <line x1="925" y1="1532" x2="985" y2="1532" stroke="#94a3b8"/>
    <line x1="1000" y1="1532" x2="1060" y2="1532" stroke="#94a3b8"/>

    <text x="40" y="1558" font-weight="bold">X3</text><text x="110" y="1558">Heat-set inserts — caliper vs <tspan font-weight="bold">M3×4×5</tspan>, and count 100</text>
    <line x1="700" y1="1562" x2="880" y2="1562" stroke="#94a3b8"/>
    <text x="900" y="1558" font-size="11" fill="#64748b">secures #14</text>

    <text x="40" y="1588" font-weight="bold">X4</text><text x="110" y="1588">New T-nut — drops in, turns, tugs?  Y / N</text>
    <line x1="700" y1="1592" x2="880" y2="1592" stroke="#94a3b8"/>
    <text x="900" y="1588" font-size="11" fill="#b91c1c">before anything is cut — secures #141</text>

    <text x="40" y="1618" font-weight="bold">X5</text><text x="110" y="1618">Relay pigtail gauge — 5-pin thick wires, in mm²</text>
    <line x1="700" y1="1622" x2="880" y2="1622" stroke="#94a3b8"/>
    <text x="900" y="1618" font-size="11" fill="#64748b">4-pin is 0.75 and must be re-terminated in AWG 14</text>
  </g>

  <!-- footer -->
  <rect x="24" y="1656" width="1192" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="44" y="1684" font-size="14" font-weight="bold" fill="#0f172a">How this sheet is meant to be used</text>
  <text x="44" y="1710" font-size="12.5" fill="#334155">Write the number, not a judgement. <tspan font-weight="bold">“about right” and “seems fine” are what this build has had to undo five times</tspan> — a hub</text>
  <text x="44" y="1730" font-size="12.5" fill="#334155">diameter wrong by 2.3 mm, two supports that did not exist, a valley the screws never reach, a nut for somebody else's profile.</text>
  <text x="44" y="1754" font-size="12.5" fill="#334155"><tspan font-weight="bold">Take every measurement on all three vehicles.</tspan> Two drive hubs on this chassis differed by 0.47 mm, which is why HUB_TOL is 0.5</text>
  <text x="44" y="1774" font-size="12.5" fill="#334155">and not 0.2. <tspan font-weight="bold">Where they differ, enter the worst case</tspan> — a part that fits the best vehicle fits one vehicle.</text>
</svg>
