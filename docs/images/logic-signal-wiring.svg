<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" width="1240" height="1000"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Logic and signal wiring — Teensy, receiver, signal MUX, relay MUX and E-stop</title>
  <desc>A wiring map of the logic side of MRider. The logic battery feeds two UBECs and a direct
  12 volt tap; the UBECs feed the Teensy and the receiver and the signal multiplexer; the Teensy's
  own 3.3 volt pin feeds the AS5600 and the two Hall latches with their pull-ups. The Teensy and
  the receiver both feed the Pololu signal multiplexer, whose two outputs drive the motor driver's
  S1 and S2. The E-stop's two normally-closed contacts break the traction contactor coil and the
  relay MUX coil separately. A panel at the foot lists seven corrections to the build page.</desc>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L9,3.2 z" fill="#334155"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L9,3.2 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L9,3.2 z" fill="#15803d"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L9,3.2 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1240" height="1000" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#0f172a">
    The logic side — power, signal, and who is allowed to drive
  </text>
  <text x="24" y="56" font-size="12.5" fill="#475569">
    <tspan fill="#b45309" font-weight="bold">Amber = power.</tspan>
    <tspan fill="#1d4ed8" font-weight="bold">  Blue = signal.</tspan>
    <tspan fill="#b91c1c" font-weight="bold">  Red = authority / interlock.</tspan>
    Traction power is not drawn — see §3.1.
  </text>

  <!-- ============ POWER COLUMN ============ -->
  <rect x="24" y="76" width="276" height="470" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="40" y="100" font-size="13.5" font-weight="bold" fill="#92400e">Power — one battery, three voltages</text>

  <rect x="44" y="116" width="150" height="56" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
  <text x="54" y="138" font-size="12" font-weight="bold" fill="#92400e">LiFePO₄ 12.8 V</text>
  <text x="54" y="156" font-size="11" fill="#78350f">6 Ah · isolated logic</text>

  <!-- 12 V direct -->
  <path d="M194,144 L236,144 L236,206" stroke="#b45309" stroke-width="2.6" fill="none" marker-end="url(#a)"/>
  <rect x="44" y="206" width="236" height="46" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="54" y="226" font-size="12" font-weight="bold" fill="#92400e">12 V direct — RELAY COILS ONLY</text>
  <text x="54" y="243" font-size="10.5" fill="#78350f">automotive coils are 12 V; no UBEC involved</text>

  <!-- UBEC A -->
  <path d="M120,172 L120,282" stroke="#b45309" stroke-width="2.6" marker-end="url(#a)"/>
  <rect x="44" y="282" width="236" height="52" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="54" y="302" font-size="12" font-weight="bold" fill="#92400e">UBEC A → 5 V</text>
  <text x="54" y="320" font-size="10.5" fill="#78350f">Teensy VIN — <tspan font-weight="bold">and nothing else</tspan></text>

  <!-- UBEC B -->
  <rect x="44" y="346" width="236" height="52" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="54" y="366" font-size="12" font-weight="bold" fill="#92400e">UBEC B → 5 V</text>
  <text x="54" y="384" font-size="10.5" fill="#78350f">receiver · Pololu MUX · driver logic</text>
  <path d="M120,334 L120,346" stroke="#b45309" stroke-width="2.6"/>

  <rect x="44" y="412" width="236" height="56" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="54" y="432" font-size="12" font-weight="bold" fill="#1e3a8a">3.3 V — from the TEENSY's own pin</text>
  <text x="54" y="450" font-size="10.5" fill="#1d4ed8">AS5600 · both Hall latches · their pull-ups</text>
  <text x="54" y="463" font-size="10" font-style="italic" fill="#1d4ed8">there is no 3.3 V UBEC, and none is needed</text>

  <rect x="44" y="482" width="236" height="48" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="54" y="500" font-size="11" font-weight="bold" fill="#14532d">The split is by AUTHORITY LAYER,</text>
  <text x="54" y="516" font-size="11" font-weight="bold" fill="#14532d">not by current draw. See ⑦</text>

  <!-- ============ TEENSY ============ -->
  <rect x="330" y="116" width="250" height="196" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.6"/>
  <text x="346" y="140" font-size="14" font-weight="bold" fill="#0f172a">Teensy 4.1</text>
  <text x="346" y="158" font-size="10.5" fill="#b91c1c" font-weight="bold">NOT 5 V tolerant · VUSB–VIN pad CUT</text>
  <text x="346" y="182" font-size="11" fill="#334155">PWM ×2 ──────────▶</text>
  <text x="346" y="202" font-size="11" fill="#334155">Serial RX ◀── i-BUS</text>
  <text x="346" y="222" font-size="11" fill="#334155">QDC ◀── Hall A/B</text>
  <text x="346" y="242" font-size="11" fill="#334155">I²C ◀── AS5600 (0x36)</text>
  <text x="346" y="262" font-size="11" fill="#334155">3.3 V out ──▶ sensors</text>
  <text x="346" y="290" font-size="11" font-weight="bold" fill="#1d4ed8">USB ──▶ laptop (micro-ROS)</text>
  <path d="M280,308 L330,308" stroke="#b45309" stroke-width="2.6" marker-end="url(#a)"/>

  <!-- sensors -->
  <rect x="330" y="340" width="250" height="52" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="344" y="360" font-size="12" font-weight="bold" fill="#1e3a8a">AS5600 at the kingpin</text>
  <text x="344" y="378" font-size="10.5" fill="#1d4ed8">I²C 0x36 · one per bus · 3.3 V</text>
  <path d="M455,340 L455,312" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ab)"/>

  <rect x="330" y="406" width="250" height="68" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="344" y="426" font-size="12" font-weight="bold" fill="#1e3a8a">2 × DRV5013 Hall latch</text>
  <text x="344" y="443" font-size="10.5" fill="#1d4ed8">on the drive hub, spaced 6.80 mm</text>
  <text x="344" y="461" font-size="10.5" font-weight="bold" fill="#b91c1c">OPEN DRAIN — needs 3.3 V pull-ups ①</text>
  <path d="M398,406 L398,392" stroke="#1d4ed8" stroke-width="2.4"/>

  <rect x="330" y="488" width="250" height="42" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="344" y="506" font-size="11.5" font-weight="bold" fill="#475569">steering motor encoder — NONE</text>
  <text x="344" y="521" font-size="10.5" fill="#64748b">the stock gearmotor has no shaft encoder ②</text>

  <!-- ============ RECEIVER + MUX ============ -->
  <rect x="616" y="116" width="226" height="118" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2.4"/>
  <text x="632" y="140" font-size="13.5" font-weight="bold" fill="#14532d">FlySky FS-iA6B</text>
  <text x="632" y="160" font-size="11" fill="#166534">i-BUS ──▶ Teensy serial</text>
  <text x="632" y="178" font-size="11" fill="#166534">PWM ×2 ──▶ MUX slave</text>
  <text x="632" y="196" font-size="11" fill="#166534">1 ch ──▶ MUX SEL</text>
  <text x="632" y="218" font-size="10.5" font-weight="bold" fill="#b91c1c">check i-BUS level before wiring ④</text>

  <path d="M616,172 L580,172" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ab)"/>

  <rect x="616" y="268" width="226" height="130" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2.4"/>
  <text x="632" y="292" font-size="13.5" font-weight="bold" fill="#14532d">Pololu #2806 signal MUX</text>
  <text x="632" y="312" font-size="11" fill="#166534">master ◀── Teensy PWM ×2</text>
  <text x="632" y="330" font-size="11" fill="#166534">slave  ◀── receiver PWM ×2</text>
  <text x="632" y="348" font-size="11" fill="#166534">SEL ◀── receiver channel</text>
  <text x="632" y="370" font-size="11" font-weight="bold" fill="#15803d">FAILMODE jumper: DISCONNECTED</text>
  <text x="632" y="386" font-size="10.5" fill="#166534">= master keeps control on SEL loss</text>

  <path d="M580,200 L600,200 L600,312 L616,312" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ab)"/>
  <path d="M729,234 L729,268" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ab)"/>

  <!-- ============ DRIVER ============ -->
  <rect x="884" y="268" width="240" height="130" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.4"/>
  <text x="900" y="292" font-size="13.5" font-weight="bold" fill="#4c1d95">Cytron MDDS30</text>
  <text x="900" y="312" font-size="11" fill="#5b21b6">S1 ◀── MUX out 1 → M1 steering</text>
  <text x="900" y="330" font-size="11" fill="#5b21b6">S2 ◀── MUX out 2 → M2 drive ×2</text>
  <text x="900" y="350" font-size="11" fill="#5b21b6">independent R/C (PWM) mode</text>
  <text x="900" y="372" font-size="11" font-weight="bold" fill="#4c1d95">★ STAR GROUND lives here</text>
  <text x="900" y="388" font-size="10.5" fill="#5b21b6">Teensy · receiver · MUX · driver, one point</text>
  <path d="M842,330 L884,330" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#ab)"/>

  <!-- ============ AUTHORITY ============ -->
  <rect x="616" y="432" width="508" height="300" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="634" y="458" font-size="13.5" font-weight="bold" fill="#7f1d1d">Authority — and the E-stop does TWO separate jobs</text>

  <rect x="636" y="476" width="190" height="78" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="650" y="498" font-size="12.5" font-weight="bold" fill="#991b1b">MRE-RR2R E-stop</text>
  <text x="650" y="516" font-size="11" fill="#7f1d1d">2 NC + 2 NO, latching</text>
  <text x="650" y="534" font-size="10.5" font-weight="bold" fill="#b91c1c">the two NC on DIFFERENT blocks</text>
  <text x="650" y="548" font-size="10" fill="#7f1d1d">— no common-cause failure</text>

  <path d="M826,500 L880,500" stroke="#b91c1c" stroke-width="2.6" marker-end="url(#ar)"/>
  <rect x="884" y="476" width="222" height="52" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="896" y="495" font-size="11.5" font-weight="bold" fill="#991b1b">NC ① → traction contactor coil</text>
  <text x="896" y="512" font-size="10.5" fill="#7f1d1d">#8a, 40 A SPST-NO → cuts TRACTION</text>

  <path d="M826,536 L880,558" stroke="#b91c1c" stroke-width="2.6" marker-end="url(#ar)"/>
  <rect x="884" y="540" width="222" height="52" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="896" y="559" font-size="11.5" font-weight="bold" fill="#991b1b">NC ② → relay MUX coils</text>
  <text x="896" y="576" font-size="10.5" fill="#7f1d1d">→ authority falls back to STOCK</text>

  <rect x="636" y="608" width="470" height="48" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="650" y="627" font-size="11.5" font-weight="bold" fill="#991b1b">Relay MUX = FOUR 5-pin SPDT per vehicle, not two DPDT ⑤</text>
  <text x="650" y="644" font-size="10.5" fill="#7f1d1d">two poles per motor × two motors. De-energised = STOCK, always.</text>

  <rect x="636" y="668" width="470" height="48" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="650" y="687" font-size="11.5" font-weight="bold" fill="#14532d">Every coil runs off the LOGIC battery, so logic dead = STOCK + traction cut</text>
  <text x="650" y="704" font-size="10.5" fill="#166534">De-energise-to-safe, and it is free: it falls out of where the coils are fed from.</text>

  <!-- ============ FINDINGS ============ -->
  <rect x="24" y="750" width="1192" height="226" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="44" y="776" font-size="14" font-weight="bold" fill="#0f172a">What this map corrects — §3.5 has drifted since it was written</text>

  <text x="44" y="802" font-size="12" fill="#334155"><tspan font-weight="bold" fill="#b91c1c">①</tspan> The Hall latches are <tspan font-weight="bold">open-drain</tspan>. They need <tspan font-weight="bold">3.3 V pull-ups</tspan>, which §3.5 never mentions — without them the quadrature decoder sees nothing.</text>
  <text x="44" y="824" font-size="12" fill="#334155"><tspan font-weight="bold" fill="#b91c1c">②</tspan> §3.5 still lists <tspan font-style="italic">"steering motor encoder A/B → second QDC channel"</tspan>. <tspan font-weight="bold">There is no such encoder</tspan> — the stock gearmotor has none, and dbw §2.1 says so.</text>
  <text x="44" y="846" font-size="12" fill="#334155"><tspan font-weight="bold" fill="#b91c1c">③</tspan> §3.1 says the angle sensor takes <tspan font-style="italic">"3.3 V from the logic rail"</tspan>. <tspan font-weight="bold">The logic rail is 5 V.</tspan> The 3.3 V comes from the Teensy's own pin — and that needs saying, because it also caps the sensor current.</text>
  <text x="44" y="868" font-size="12" fill="#334155"><tspan font-weight="bold" fill="#b91c1c">④</tspan> <tspan font-weight="bold">The Teensy 4.1 is not 5 V tolerant.</tspan> i-BUS from a 5 V-powered receiver has to be level-checked before it touches a serial pin. One wire, one meter, one minute.</text>
  <text x="44" y="890" font-size="12" fill="#334155"><tspan font-weight="bold" fill="#b91c1c">⑤</tspan> §3.4 says <tspan font-style="italic">"two DPDT relays"</tspan>; what was bought is <tspan font-weight="bold">four 5-pin SPDT per vehicle</tspan>. Same function, different count — and the count is what someone wires.</text>
  <text x="44" y="912" font-size="12" fill="#334155"><tspan font-weight="bold" fill="#15803d">⑥ DECIDED</tspan> — the E-stop contactor coil runs off the <tspan font-weight="bold">LOGIC battery</tspan>. On the traction pack it would <tspan font-weight="bold">chatter during a stall brownout</tspan> — sag drops the coil, which cuts traction, which restores the sag. Cost: no logic battery ⇒ the car is dead, not a stock toy.</text>
  <text x="44" y="934" font-size="12" fill="#334155"><tspan font-weight="bold" fill="#15803d">⑦ DECIDED</tspan> — <tspan font-weight="bold">UBEC A carries the Teensy alone; UBEC B carries the receiver, the MUX and the driver logic.</tspan> Split by authority layer: a UBEC A failure must not take out the override that exists to survive the Teensy.</text>
  <text x="44" y="960" font-size="12" font-weight="bold" fill="#15803d">None of these is expensive to fix now. All of them are expensive to find at Stage 2 with thirteen students waiting.</text>
</svg>
